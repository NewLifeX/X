name: mobile

on:
  push:
    branches: [ '*' ]
    paths:
      - 'Samples/Mobile.Core/**'
      - 'Samples/Mobile.Console/**'
      - 'Samples/Mobile.Android/**'
      - 'Samples/Mobile.iOS/**'
      - 'NewLife.Core/**'
      - 'NewLife.Core.SourceGenerator/**'
      - 'Directory.Build.props'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [ '*' ]
    paths:
      - 'Samples/Mobile.Core/**'
      - 'Samples/Mobile.Console/**'
      - 'Samples/Mobile.Android/**'
      - 'Samples/Mobile.iOS/**'
      - 'NewLife.Core/**'
      - 'NewLife.Core.SourceGenerator/**'
      - 'Directory.Build.props'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

jobs:
  android:
    name: android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup dotNET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Android workload
        run: dotnet workload install android || sudo dotnet workload install android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: pwsh ./Samples/Mobile.Android/run-android.ps1 -Configuration Release -TimeoutSec 240 -Smoke
      - name: Upload Android artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: Bin/Mobile.Android/**

  ios:
    name: ios simulator
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Setup dotNET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install iOS workload
        # iOS SDK 版本必须与 Xcode 主次版本严格一致：默认 workload set 的 iOS 27 需要 Xcode 27，
        # 这里固定到 Xcode 26.6 对应的 workload set（10.400.1 → iOS 26.5.10315）
        run: dotnet workload install ios --version 10.400.1 || sudo dotnet workload install ios --version 10.400.1
      - name: Run iOS smoke
        run: bash ./Samples/Mobile.iOS/run-ios.sh
      - name: Upload iOS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios
          path: Bin/Mobile.iOS/**
