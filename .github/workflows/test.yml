name: test

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  # 全解决方案编译校验（含 Samples/Zero.*/Benchmark 等非测试工程），与测试矩阵并行运行
  build:
    name: build solution
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Build
      shell: pwsh
      # 源生成器工程既作为解决方案条目、又被多目标工程引用生成，两类实例会被并行重复生成，
      # 偶发 CS2012（同一 obj 输出被两个编译器进程写入）；重试一次即可（第二次已是增量构建）
      run: |
        dotnet build -c Release
        if ($LASTEXITCODE -ne 0) {
          Write-Host '首次构建失败，重试一次（已知并行重复生成竞态）'
          dotnet build -c Release
          if ($LASTEXITCODE -ne 0) { exit 1 }
        }

  # 测试矩阵：每个目标框架独立 job，job 间并行且互不争抢宿主资源（进程/端口/CPU），
  # 每个 job 只构建自身目标框架，省去全解决方案构建的墙钟开销（编译校验由 build job 承担）。
  # 测试内并行度由各工程 xunit.runner.json 的 maxParallelThreads 控制。
  test:
    name: test (${{ matrix.name }})
    # 未声明 os 的矩阵项按 windows-latest（现状矩阵不动）；experimental 项为观察期，平台稳定全绿后逐项去掉该标记转阻断
    runs-on: ${{ matrix.os || 'windows-latest' }}
    timeout-minutes: 40
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core-net8.0
            project: 'XUnitTest.Core\XUnitTest.Core.csproj'
            framework: net8.0
            dotnet: |
              8.x
              10.x
          - name: Core-net8.0-windows
            project: 'XUnitTest.Core\XUnitTest.Core.csproj'
            framework: net8.0-windows
            dotnet: |
              8.x
              10.x
          - name: Core-net9.0
            project: 'XUnitTest.Core\XUnitTest.Core.csproj'
            framework: net9.0
            dotnet: |
              9.x
              10.x
          - name: Core-net10.0
            project: 'XUnitTest.Core\XUnitTest.Core.csproj'
            framework: net10.0
            dotnet: 10.x
          - name: Core-net10.0-windows
            project: 'XUnitTest.Core\XUnitTest.Core.csproj'
            framework: net10.0-windows
            dotnet: 10.x
          - name: Net6-net6.0
            project: 'XUnitTest.Net6\XUnitTest.Net6.csproj'
            framework: net6.0
            dotnet: |
              6.x
              10.x
          - name: Net6-net6.0-windows
            project: 'XUnitTest.Net6\XUnitTest.Net6.csproj'
            framework: net6.0-windows
            dotnet: |
              6.x
              10.x
          - name: Compat-net462
            project: 'XUnitTest.Compat\XUnitTest.Compat.csproj'
            framework: net462
            dotnet: 10.x
          - name: Compat-net8.0
            project: 'XUnitTest.Compat\XUnitTest.Compat.csproj'
            framework: net8.0
            dotnet: |
              8.x
              10.x
          - name: SourceGenerator
            project: 'XUnitTest.SourceGenerator\XUnitTest.SourceGenerator.csproj'
            framework: net10.0
            dotnet: 10.x

          # ================= 跨平台矩阵（观察期） =================
          # Linux x64：全量工程覆盖（Core 双 TFM + Compat + 源生成器）
          - name: Core-net8.0-linux-x64
            os: ubuntu-latest
            project: XUnitTest.Core/XUnitTest.Core.csproj
            framework: net8.0
            dotnet: |
              8.x
              10.x
            experimental: true
          - name: Core-net10.0-linux-x64
            os: ubuntu-latest
            project: XUnitTest.Core/XUnitTest.Core.csproj
            framework: net10.0
            dotnet: 10.x
            experimental: true
          - name: Compat-net8.0-linux-x64
            os: ubuntu-latest
            project: XUnitTest.Compat/XUnitTest.Compat.csproj
            framework: net8.0
            dotnet: |
              8.x
              10.x
            experimental: true
          - name: SourceGenerator-linux-x64
            os: ubuntu-latest
            project: XUnitTest.SourceGenerator/XUnitTest.SourceGenerator.csproj
            framework: net10.0
            dotnet: 10.x
            experimental: true
          # Linux arm64
          - name: Core-net8.0-linux-arm64
            os: ubuntu-24.04-arm
            project: XUnitTest.Core/XUnitTest.Core.csproj
            framework: net8.0
            dotnet: |
              8.x
              10.x
            experimental: true
          - name: Core-net10.0-linux-arm64
            os: ubuntu-24.04-arm
            project: XUnitTest.Core/XUnitTest.Core.csproj
            framework: net10.0
            dotnet: 10.x
            experimental: true
          # macOS：3 vCPU，改用 test.ci.macos.runsettings 降并行度
          - name: Core-net8.0-osx-arm64
            os: macos-latest
            project: XUnitTest.Core/XUnitTest.Core.csproj
            framework: net8.0
            dotnet: |
              8.x
              10.x
            runsettings: test.ci.macos.runsettings
            experimental: true
          - name: Core-net10.0-osx-arm64
            os: macos-latest
            project: XUnitTest.Core/XUnitTest.Core.csproj
            framework: net10.0
            dotnet: 10.x
            runsettings: test.ci.macos.runsettings
            experimental: true
          - name: Core-net8.0-osx-x64
            os: macos-15-intel
            project: XUnitTest.Core/XUnitTest.Core.csproj
            framework: net8.0
            dotnet: |
              8.x
              10.x
            runsettings: test.ci.macos.runsettings
            experimental: true
          - name: Core-net10.0-osx-x64
            os: macos-15-intel
            project: XUnitTest.Core/XUnitTest.Core.csproj
            framework: net10.0
            dotnet: 10.x
            runsettings: test.ci.macos.runsettings
            experimental: true
          # Windows arm64
          - name: Core-net8.0-win-arm64
            os: windows-11-arm
            project: XUnitTest.Core/XUnitTest.Core.csproj
            framework: net8.0
            dotnet: |
              8.x
              10.x
            experimental: true
          - name: Core-net10.0-win-arm64
            os: windows-11-arm
            project: XUnitTest.Core/XUnitTest.Core.csproj
            framework: net10.0
            dotnet: 10.x
            experimental: true

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet }}
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Test
      # test.ci.runsettings：4 核 runner 把 xUnit 并行线程压到与核数匹配，避免过度订阅导致时序用例失真（macOS 用专用配置降为 3）；
      # blame-hang：用例挂起时超时转储，便于事后定位（正常单 job 约 2~3 分钟，远小于 15 分钟阈值）
      run: dotnet test ${{ matrix.project }} -f ${{ matrix.framework }} -c Release -s ${{ matrix.runsettings || 'test.ci.runsettings' }} --blame-hang-timeout 15m --blame-hang-dump-type Mini --logger "trx;LogFileName=${{ matrix.name }}.trx" --results-directory TestResults
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.name }}
        path: TestResults/*.trx
        if-no-files-found: ignore

  # musl 容器矩阵（观察期）：alpine 内原生运行单测（x64/arm64 各一档，只跑 net10.0）
  # 容器内 actions/setup-dotnet 不可用，改用 dotnet-install.sh；宿主先 warm NuGet 缓存并挂载进容器复用
  test-musl:
    name: test (musl-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET (warm NuGet cache)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Test (alpine, net10.0)
      run: |
        docker run --rm -v "$PWD:/src" -v "$HOME/.nuget/packages:/nuget-packages" -e NUGET_PACKAGES=/nuget-packages -w /src alpine:3.20 sh -c '
          set -e
          apk add --no-cache bash curl icu-libs krb5-libs libgcc libstdc++ tzdata >/dev/null
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 10.0 --install-dir /usr/share/dotnet >/dev/null
          ln -s /usr/share/dotnet/dotnet /usr/bin/dotnet
          export DOTNET_CLI_TELEMETRY_OPTOUT=1
          dotnet test XUnitTest.Core/XUnitTest.Core.csproj -f net10.0 -c Release --nologo -s test.ci.runsettings
        '

  # 源生成器随主包分发校验
  pack:
    name: pack check
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Pack 校验（源生成器随主包分发）
      # 校验主包 NewLife.Core 内含 analyzers/dotnet/cs 的分析器程序集，且 lib 正常
      run: |
        dotnet pack NewLife.Core\NewLife.Core.csproj -c Release -o out-sg
        $zip = Get-ChildItem out-sg\NewLife.Core.*.nupkg | Select-Object -First 1
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
        $names = $archive.Entries | ForEach-Object { $_.FullName }
        $archive.Dispose()
        if (-not ($names -contains 'analyzers/dotnet/cs/NewLife.Core.SourceGenerator.dll')) { throw '主包缺少 analyzers/dotnet/cs/NewLife.Core.SourceGenerator.dll' }
        if (-not ($names -match '^lib/net8.0/NewLife.Core.dll')) { throw '主包缺少 lib/net8.0/NewLife.Core.dll' }
        Write-Host ($names -join "`n")
