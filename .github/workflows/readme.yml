name: readme

# README 语言切换行由 Tools/Scripts/sync-readme-languages.ps1 从 readme-languages.json 生成。
# 手工改顺序、或某一份副本忘记同步，都会在这里被拦下。
on:
  push:
    branches: [ '*' ]
    paths:
      - 'README*.md'
      - 'readme-languages.json'
      - 'readme-metrics.json'
      - 'readme-package.json'
      - 'Tools/Scripts/sync-readme-languages.ps1'
      - 'Tools/Scripts/sync-readme-metrics.ps1'
      - 'Tools/Scripts/sync-readme-package.ps1'
      - '.github/workflows/readme.yml'
  pull_request:
    branches: [ '*' ]
    paths:
      - 'README*.md'
      - 'readme-languages.json'
      - 'readme-metrics.json'
      - 'readme-package.json'
      - 'Tools/Scripts/sync-readme-languages.ps1'
      - 'Tools/Scripts/sync-readme-metrics.ps1'
      - 'Tools/Scripts/sync-readme-package.ps1'
      - '.github/workflows/readme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  language-switcher:
    name: check readme
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4
    - name: Check README language switcher
      shell: pwsh
      run: pwsh -NoProfile -File ./Tools/Scripts/sync-readme-languages.ps1 -Check
    - name: Check README metrics
      shell: pwsh
      run: pwsh -NoProfile -File ./Tools/Scripts/sync-readme-metrics.ps1 -Check
    - name: Check README package copy
      shell: pwsh
      run: pwsh -NoProfile -File ./Tools/Scripts/sync-readme-package.ps1 -Check
