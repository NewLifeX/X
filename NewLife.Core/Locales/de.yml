"System settings": "Systemeinstellungen"
"System name": "Systemname"
"English name used to identify the system; must not contain spaces.": "Englischer Name zur Identifizierung des Systems; darf keine Leerzeichen enthalten."
"System version": "Systemversion"
"Assembly version number, used for UI display.": "Assembly-Versionsnummer, verwendet für die UI-Anzeige."
"System display name": "Anzeigename"
"User-visible name.": "Für Benutzer sichtbarer Name."
"Company": "Unternehmen"
"Company name, from assembly information.": "Unternehmensname aus den Assemblyinformationen."
"Application instance": "Anwendungsinstanz"
"Uniquely identifies the instance node when a single application is deployed with multiple instances.": "Identifiziert den Instanzknoten eindeutig, wenn eine Anwendung mit mehreren Instanzen bereitgestellt wird."
"Developer mode": "Entwicklermodus"
"Enables development and debugging features (SQL collection, backup, development operations).": "Aktiviert Entwicklungs- und Debugfunktionen (SQL-Sammlung, Sicherung, Entwicklungsvorgänge)."
"Enabled": "Aktiviert"
"Whether the system is enabled.": "Gibt an, ob das System aktiviert ist."
"Install time": "Installationszeit"
"First installation time of the system, used as the Cookie encryption key.": "Erstmalige Installationszeit des Systems, verwendet als Cookie-Verschlüsselungsschlüssel."
"Core settings": "Kerneinstellungen"
"Global debugging. Enables XTrace.Debug.": "Globales Debugging. Aktiviert XTrace.Debug."
"Log level. Only logs at or above this level are output: All/Debug/Info/Warn/Error/Fatal. Default Info.": "Protokollstufe. Es werden nur Protokolle dieser Stufe oder höher ausgegeben: All/Debug/Info/Warn/Error/Fatal. Standard: Info."
"File log directory. Defaults to the Log subdirectory.": "Verzeichnis für Dateiprotokolle. Standard: Unterverzeichnis Log."
"Log file size limit (MB). Splits a new log file when exceeded. Default 10 MB; 0 means unlimited.": "Größenlimit für Protokolldateien (MB). Bei Überschreitung wird eine neue Protokolldatei erstellt. Standard: 10 MB; 0 bedeutet unbegrenzt."
"Log file backups. The oldest files are deleted when the count is exceeded. Cybersecurity law requires at least 6 months of logs. Default 200; 0 means unlimited.": "Anzahl der Protokolldatei-Sicherungen. Älteste Dateien werden bei Überschreitung gelöscht. Das Cybersicherheitsgesetz verlangt mindestens 6 Monate Protokolle. Standard: 200; 0 bedeutet unbegrenzt."
"Log file format. Default {0:yyyy_MM_dd}.log; supports level placeholders such as {1}_{0:yyyy_MM_dd}.log.": "Format der Protokolldatei. Standard: {0:yyyy_MM_dd}.log; unterstützt Ebenen-Platzhalter wie {1}_{0:yyyy_MM_dd}.log."
"Log line format. Default Time|ThreadId|Kind|Name|Message; Level is also supported.": "Format der Protokollzeilen. Standard: Time|ThreadId|Kind|Name|Message; Level wird ebenfalls unterstützt."
"Network log. Broadcasts local subnet logs to udp://255.255.255.255:514, or http://xxx:80/log.": "Netzwerkprotokoll. Überträgt Protokolle des lokalen Subnetzes an udp://255.255.255.255:514 oder http://xxx:80/log."
"Data directory. Local database directory; defaults to the Data subdirectory.": "Datenverzeichnis. Lokales Datenbankverzeichnis; Standard: Unterverzeichnis Data."
"Backup directory. Directory for database backups; defaults to the Backup subdirectory.": "Sicherungsverzeichnis. Verzeichnis für Datenbanksicherungen; Standard: Unterverzeichnis Backup."
"Plugin directory. Local plugin directory; defaults to the Plugins subdirectory.": "Plugin-Verzeichnis. Lokales Plugin-Verzeichnis; Standard: Unterverzeichnis Plugins."
"Plugin server. Analyzes links by keyword and downloads plugins from this page. Some embedded devices do not support HTTPS.": "Plugin-Server. Analysiert Links nach Schlüsselwörtern und lädt Plugins von dieser Seite herunter. Einige eingebettete Geräte unterstützen kein HTTPS."
"Assembly resolve assistance. Whether to help resolve missing dependency assemblies during assembly loading. Default false.": "Assembly-Auflösungsunterstützung. Gibt an, ob fehlende Abhängigkeitsassemblys beim Laden aufgelöst werden sollen. Standard: false."
"Service address. Public address visited by users, outside the reverse proxy, used to construct other URLs (such as SSO) or register with the registry. Separate multiple addresses with commas.": "Dienstadresse. Öffentliche Adresse, die Benutzer aufrufen, außerhalb des Reverse-Proxys, verwendet zum Erstellen anderer URLs (z. B. SSO) oder zur Registrierung. Mehrere Adressen durch Kommas trennen."
"Network settings": "Netzwerkeinstellungen"
"Network debugging.": "Netzwerk-Debugging."
"Session timeout. A TCP/UDP session is taken offline after being inactive for this period. Default 20*60 seconds.": "Sitzungszeitlimit. Eine TCP/UDP-Sitzung wird nach dieser Inaktivitätsdauer offline genommen. Standard: 20*60 Sekunden."
"Buffer size. IOCP async receive buffer size per socket. Larger values reduce small-packet merges but waste memory with many connections. Default 8k.": "Puffergröße. IOCP-Empfangspuffergröße pro Socket. Größere Werte reduzieren die Zusammenführung kleiner Pakete, verbrauchen aber bei vielen Verbindungen viel Speicher. Standard: 8k."
"Kernel receive buffer (SO_RCVBUF). 0 means do not modify; use the system default.": "Kernel-Empfangspuffer (SO_RCVBUF). 0 bedeutet nicht ändern; Systemstandard verwenden."
"Send/receive log body length. HEX length of data logged by LogSend/LogReceive. Default 64 bytes.": "Länge des Sende-/Empfangsprotokoll-Datenkörpers. HEX-Länge der von LogSend/LogReceive protokollierten Daten. Standard: 64 Bytes."
"Auto GZip request body size. Applies to requests from HttpHelper/ApiHttpClient. Default 1024; 0 disables compression.": "Größe des Anforderungskörpers für automatische GZip-Aktivierung. Gilt für Anforderungen von HttpHelper/ApiHttpClient. Standard: 1024; 0 deaktiviert die Komprimierung."
"UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture.": "UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture."
