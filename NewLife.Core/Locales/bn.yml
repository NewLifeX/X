"Core settings": "মূল সেটিংস"
"Global debugging. Enables XTrace.Debug.": "গ্লোবাল ডিবাগিং। XTrace.Debug সক্ষম করে।"
"Log level. Only logs at or above this level are output: All/Debug/Info/Warn/Error/Fatal. Default Info.": "লগレベル। শুধুমাত্র এই স্তর বা উচ্চতর লগ আউটপুট হয়: All/Debug/Info/Warn/Error/Fatal। ডিফল্ট: Info।"
"File log directory. Defaults to the Log subdirectory.": "ফাইল লগ ডিরেক্টরি। ডিফল্ট: Log সাবডিরেক্টরি।"
"Log file size limit (MB). Splits a new log file when exceeded. Default 10 MB; 0 means unlimited.": "লগ ফাইলের আকার সীমা (MB)। অতিক্রম করলে নতুন লগ ফাইল তৈরি হয়। ডিফল্ট: 10 MB; 0 মানে সীমাহীন।"
"Log file backups. The oldest files are deleted when the count is exceeded. Cybersecurity law requires at least 6 months of logs. Default 200; 0 means unlimited.": "লগ ফাইল ব্যাকআপ। সংখ্যা অতিক্রম করলে সবচেয়ে পুরোনো ফাইলগুলি মুছে ফেলা হয়। সাইবার সুরক্ষা আইন কমপক্ষে 6 মাসের লগ রাখার প্রয়োজন করে। ডিফল্ট: 200; 0 মানে সীমাহীন।"
"Log file format. Default {0:yyyy_MM_dd}.log; supports level placeholders such as {1}_{0:yyyy_MM_dd}.log.": "লগ ফাইল ফরম্যাট। ডিফল্ট: {0:yyyy_MM_dd}.log; {1}_{0:yyyy_MM_dd}.log এর মতো লেভেল প্লেসহোল্ডার সমর্থন করে।"
"Log line format. Default Time|ThreadId|Kind|Name|Message; Level is also supported.": "লগ লাইন ফরম্যাট। ডিফল্ট: Time|ThreadId|Kind|Name|Message; Level-ও সমর্থিত।"
"Network log. Broadcasts local subnet logs to udp://255.255.255.255:514, or http://xxx:80/log.": "নেটওয়ার্ক লগ। স্থানীয় সাবনেট লগ udp://255.255.255.255:514 বা http://xxx:80/log-এ সম্প্রচার করে।"
"Data directory. Local database directory; defaults to the Data subdirectory.": "ডেটা ডিরেক্টরি। স্থানীয় ডেটাবেস ডিরেক্টরি; ডিফল্ট: Data সাবডিরেক্টরি।"
"Backup directory. Directory for database backups; defaults to the Backup subdirectory.": "ব্যাকআপ ডিরেক্টরি। ডেটাবেস ব্যাকআপের জন্য ডিরেক্টরি; ডিফল্ট: Backup সাবডিরেক্টরি।"
"Plugin directory. Local plugin directory; defaults to the Plugins subdirectory.": "প্লাগইন ডিরেক্টরি। স্থানীয় প্লাগইন ডিরেক্টরি; ডিফল্ট: Plugins সাবডিরেক্টরি।"
"Plugin server. Analyzes links by keyword and downloads plugins from this page. Some embedded devices do not support HTTPS.": "প্লাগইন সার্ভার। কীওয়ার্ড অনুযায়ী লিঙ্ক বিশ্লেষণ করে এবং এই পৃষ্ঠা থেকে প্লাগইন ডাউনলোড করে। কিছু এমবেডেড ডিভাইস HTTPS সমর্থন করে না।"
"Assembly resolve assistance. Whether to help resolve missing dependency assemblies during assembly loading. Default false.": "অ্যাসেম্বলি সমাধান সহায়তা। লোডিংয়ের সময় অনুপস্থিত নির্ভরশীল অ্যাসেম্বলি সমাধানে সহায়তা করবে কিনা তা নির্ধারণ করে। ডিফল্ট: false।"
"Service address. Public address visited by users, outside the reverse proxy, used to construct other URLs (such as SSO) or register with the registry. Separate multiple addresses with commas.": "পরিষেবা ঠিকানা। ব্যবহারকারীরা যে সর্বজনীন ঠিকানা পরিদর্শন করেন, রিভার্স প্রক্সির বাইরে, অন্যান্য URL (যেমন SSO) তৈরি বা রেজিস্ট্রিতে নিবন্ধনের জন্য ব্যবহৃত হয়। একাধিক ঠিকানা কমা দিয়ে আলাদা করুন।"
"Network settings": "নেটওয়ার্ক সেটিংস"
"Network debugging.": "নেটওয়ার্ক ডিবাগিং।"
"Session timeout. A TCP/UDP session is taken offline after being inactive for this period. Default 20*60 seconds.": "সেশন টাইমআউট। এই নিষ্ক্রিয়তার সময়ের পরে একটি TCP/UDP সেশন অফলাইন করা হয়। ডিফল্ট: 20*60 সেকেন্ড।"
"Buffer size. IOCP async receive buffer size per socket. Larger values reduce small-packet merges but waste memory with many connections. Default 8k.": "বাফার আকার। প্রতি সকেটে IOCP অ্যাসিঙ্ক্রোনাস রিসিভ বাফার আকার। বড় মান ছোট প্যাকেট একত্রীকরণ কমায় কিন্তু অনেক সংযোগে মেমরি নষ্ট করে। ডিফল্ট: 8k।"
"Kernel receive buffer (SO_RCVBUF). 0 means do not modify; use the system default.": "কার্নেল রিসিভ বাফার (SO_RCVBUF)। 0 মানে পরিবর্তন করবেন না; সিস্টেম ডিফল্ট ব্যবহার করুন।"
"Send/receive log body length. HEX length of data logged by LogSend/LogReceive. Default 64 bytes.": "পাঠান/গ্রহণ লগ বডি দৈর্ঘ্য। LogSend/LogReceive দ্বারা লগ করা ডেটার HEX দৈর্ঘ্য। ডিফল্ট: 64 বাইট।"
"Auto GZip request body size. Applies to requests from HttpHelper/ApiHttpClient. Default 1024; 0 disables compression.": "স্বয়ংক্রিয় GZip সক্ষম করার জন্য অনুরোধ বডি আকার। HttpHelper/ApiHttpClient-এর অনুরোধে প্রযোজ্য। ডিফল্ট: 1024; 0 কম্প্রেশন নিষ্ক্রিয় করে।"
"UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture.": "ইন্টারফেস ভাষা। মান: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN। খালি রাখলে সিস্টেম অনুসরণ করে; সমর্থিত ভাষা অনুরোধের সংস্কৃতি নির্বিশেষে ইন্টারফেস ও লগের ভাষা স্থির করে।"
