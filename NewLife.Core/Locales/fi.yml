"System settings": "Järjestelmäasetukset"
"System name": "Järjestelmän nimi"
"English name used to identify the system; must not contain spaces.": "Järjestelmän tunnistava englanninkielinen nimi; ei saa sisältää välilyöntejä."
"System version": "Järjestelmän versio"
"Assembly version number, used for UI display.": "Kokoonpanon versionumero, käytetään käyttöliittymän näytössä."
"System display name": "Näyttönimi"
"User-visible name.": "Käyttäjälle näkyvä nimi."
"Company": "Yritys"
"Company name, from assembly information.": "Yrityksen nimi kokoonpanotiedoista."
"Application instance": "Sovellusinstanssi"
"Uniquely identifies the instance node when a single application is deployed with multiple instances.": "Tunnistaa instanssisolmun yksilöllisesti, kun yksi sovellus otetaan käyttöön useana instanssina."
"Developer mode": "Kehittäjätila"
"Enables development and debugging features (SQL collection, backup, development operations).": "Ottaa käyttöön kehitys- ja virheenkorjaustoiminnot (SQL-keruu, varmuuskopiointi, kehitystoiminnot)."
"Enabled": "Käytössä"
"Whether the system is enabled.": "Onko järjestelmä käytössä."
"Install time": "Asennusaika"
"First installation time of the system, used as the Cookie encryption key.": "Järjestelmän ensimmäinen asennusaika, käytetään Cookie-salausavaimena."
"Core settings": "Ydinasetukset"
"Global debugging. Enables XTrace.Debug.": "Globaali virheenkorjaus. Ottaa XTrace.Debugin käyttöön."
"Log level. Only logs at or above this level are output: All/Debug/Info/Warn/Error/Fatal. Default Info.": "Lokitaso. Vain tämän tason tai korkeammat lokit tulostetaan: All/Debug/Info/Warn/Error/Fatal. Oletus: Info."
"File log directory. Defaults to the Log subdirectory.": "Tiedostolokien hakemisto. Oletus: Log-alihakemisto."
"Log file size limit (MB). Splits a new log file when exceeded. Default 10 MB; 0 means unlimited.": "Lokitiedoston kokoraja (MB). Ylityksen jälkeen luodaan uusi lokitiedosto. Oletus: 10 MB; 0 tarkoittaa rajoittamatonta."
"Log file backups. The oldest files are deleted when the count is exceeded. Cybersecurity law requires at least 6 months of logs. Default 200; 0 means unlimited.": "Lokitiedostojen varmuuskopiot. Vanhimmat tiedostot poistetaan, kun määrä ylittyy. Kyberturvallisuuslaki edellyttää vähintään 6 kuukauden lokit. Oletus: 200; 0 tarkoittaa rajoittamatonta."
"Log file format. Default {0:yyyy_MM_dd}.log; supports level placeholders such as {1}_{0:yyyy_MM_dd}.log.": "Lokitiedoston muoto. Oletus: {0:yyyy_MM_dd}.log; tukee tason paikkamerkkejä, kuten {1}_{0:yyyy_MM_dd}.log."
"Log line format. Default Time|ThreadId|Kind|Name|Message; Level is also supported.": "Lokirivin muoto. Oletus: Time|ThreadId|Kind|Name|Message; myös Level on tuettu."
"Network log. Broadcasts local subnet logs to udp://255.255.255.255:514, or http://xxx:80/log.": "Verkkoloki. Lähettää paikallisen aliverkon lokit osoitteeseen udp://255.255.255.255:514 tai http://xxx:80/log."
"Data directory. Local database directory; defaults to the Data subdirectory.": "Datahakemisto. Paikallisen tietokannan hakemisto; oletus: Data-alihakemisto."
"Backup directory. Directory for database backups; defaults to the Backup subdirectory.": "Varmuuskopiohakemisto. Tietokannan varmuuskopioiden hakemisto; oletus: Backup-alihakemisto."
"Plugin directory. Local plugin directory; defaults to the Plugins subdirectory.": "Liitännäishakemisto. Paikallinen liitännäishakemisto; oletus: Plugins-alihakemisto."
"Plugin server. Analyzes links by keyword and downloads plugins from this page. Some embedded devices do not support HTTPS.": "Liitännäispalvelin. Analysoi linkit avainsanojen mukaan ja lataa liitännäiset tältä sivulta. Jotkin sulautetut laitteet eivät tue HTTPS:ää."
"Assembly resolve assistance. Whether to help resolve missing dependency assemblies during assembly loading. Default false.": "Kokoonpanon ratkaisun tuki. Määrittää, autetaanko puuttuvien riippuvuuskokoonpanojen ratkaisemisessa latauksen aikana. Oletus: false."
"Service address. Public address visited by users, outside the reverse proxy, used to construct other URLs (such as SSO) or register with the registry. Separate multiple addresses with commas.": "Palveluosoite. Julkinen osoite, jota käyttäjät käyttävät, käänteisen välityspalvelimen ulkopuolella, käytetään muiden URL-osoitteiden (kuten SSO) muodostamiseen tai rekisteriin rekisteröimiseen. Erota useat osoitteet pilkuilla."
"Network settings": "Verkkoasetukset"
"Network debugging.": "Verkon virheenkorjaus."
"Session timeout. A TCP/UDP session is taken offline after being inactive for this period. Default 20*60 seconds.": "Istunnon aikakatkaisu. TCP/UDP-istunto siirretään offline-tilaan tämän passiivisuusjakson jälkeen. Oletus: 20*60 sekuntia."
"Buffer size. IOCP async receive buffer size per socket. Larger values reduce small-packet merges but waste memory with many connections. Default 8k.": "Puskurin koko. IOCP:n asynkronisen vastaanottopuskurin koko sokettia kohti. Suuremmat arvot vähentävät pienten pakettien yhdistämistä mutta kuluttavat muistia monien yhteyksien kanssa. Oletus: 8k."
"Kernel receive buffer (SO_RCVBUF). 0 means do not modify; use the system default.": "Ytimen vastaanottopuskuri (SO_RCVBUF). 0 tarkoittaa, ettei muuteta; käytä järjestelmän oletusarvoa."
"Send/receive log body length. HEX length of data logged by LogSend/LogReceive. Default 64 bytes.": "Lähetys-/vastaanottolokin rungon pituus. LogSend/LogReceiven kirjaamien tietojen HEX-pituus. Oletus: 64 tavua."
"Auto GZip request body size. Applies to requests from HttpHelper/ApiHttpClient. Default 1024; 0 disables compression.": "Automaattisen GZipin pyynnön rungon koko. Koskee HttpHelper/ApiHttpClientin pyyntöjä. Oletus: 1024; 0 poistaa pakkauksen käytöstä."
"UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture.": "UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture."
