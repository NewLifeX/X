"User-visible name.": "Nama yang terlihat oleh pengguna."
"Company": "Perusahaan"
"Company name, from assembly information.": "Nama perusahaan, dari informasi assembly."
"Application instance": "Instans aplikasi"
"Uniquely identifies the instance node when a single application is deployed with multiple instances.": "Mengidentifikasi node instans secara unik saat satu aplikasi diterapkan dengan beberapa instans."
"Developer mode": "Mode pengembang"
"Enables development and debugging features (SQL collection, backup, development operations).": "Mengaktifkan fitur pengembangan dan debug (pengumpulan SQL, pencadangan, operasi pengembangan)."
"Enabled": "Diaktifkan"
"Whether the system is enabled.": "Apakah sistem diaktifkan."
"Install time": "Waktu pemasangan"
"First installation time of the system, used as the Cookie encryption key.": "Waktu pemasangan pertama sistem, digunakan sebagai kunci enkripsi Cookie."
"Core settings": "Pengaturan inti"
"Global debugging. Enables XTrace.Debug.": "Debug global. Mengaktifkan XTrace.Debug."
"Log level. Only logs at or above this level are output: All/Debug/Info/Warn/Error/Fatal. Default Info.": "Tingkat log. Hanya log pada tingkat ini atau lebih tinggi yang dikeluarkan: All/Debug/Info/Warn/Error/Fatal. Default: Info."
"File log directory. Defaults to the Log subdirectory.": "Direktori log file. Default: subdirektori Log."
"Log file size limit (MB). Splits a new log file when exceeded. Default 10 MB; 0 means unlimited.": "Batas ukuran file log (MB). File log baru dibuat jika terlampaui. Default: 10 MB; 0 berarti tanpa batas."
"Log file backups. The oldest files are deleted when the count is exceeded. Cybersecurity law requires at least 6 months of logs. Default 200; 0 means unlimited.": "Cadangan file log. File tertua dihapus jika jumlah terlampaui. Undang-undang keamanan siber mewajibkan setidaknya 6 bulan log. Default: 200; 0 berarti tanpa batas."
"Log file format. Default {0:yyyy_MM_dd}.log; supports level placeholders such as {1}_{0:yyyy_MM_dd}.log.": "Format file log. Default: {0:yyyy_MM_dd}.log; mendukung placeholder tingkat seperti {1}_{0:yyyy_MM_dd}.log."
"Log line format. Default Time|ThreadId|Kind|Name|Message; Level is also supported.": "Format baris log. Default: Time|ThreadId|Kind|Name|Message; Level juga didukung."
"Network log. Broadcasts local subnet logs to udp://255.255.255.255:514, or http://xxx:80/log.": "Log jaringan. Menyiarkan log subnet lokal ke udp://255.255.255.255:514 atau http://xxx:80/log."
"Data directory. Local database directory; defaults to the Data subdirectory.": "Direktori data. Direktori database lokal; default: subdirektori Data."
"Backup directory. Directory for database backups; defaults to the Backup subdirectory.": "Direktori cadangan. Direktori untuk cadangan database; default: subdirektori Backup."
"Plugin directory. Local plugin directory; defaults to the Plugins subdirectory.": "Direktori plugin. Direktori plugin lokal; default: subdirektori Plugins."
"Plugin server. Analyzes links by keyword and downloads plugins from this page. Some embedded devices do not support HTTPS.": "Server plugin. Menganalisis tautan berdasarkan kata kunci dan mengunduh plugin dari halaman ini. Beberapa perangkat tertanam tidak mendukung HTTPS."
"Assembly resolve assistance. Whether to help resolve missing dependency assemblies during assembly loading. Default false.": "Bantuan resolusi assembly. Menentukan apakah membantu menyelesaikan assembly dependen yang hilang saat pemuatan. Default: false."
"Service address. Public address visited by users, outside the reverse proxy, used to construct other URLs (such as SSO) or register with the registry. Separate multiple addresses with commas.": "Alamat layanan. Alamat publik yang dikunjungi pengguna, di luar proxy terbalik, digunakan untuk membangun URL lain (seperti SSO) atau mendaftar ke registri. Pisahkan beberapa alamat dengan koma."
"Network settings": "Pengaturan jaringan"
"Network debugging.": "Debug jaringan."
"Session timeout. A TCP/UDP session is taken offline after being inactive for this period. Default 20*60 seconds.": "Waktu tunggu sesi. Sesi TCP/UDP diambil offline setelah periode tidak aktif ini. Default: 20*60 detik."
"Buffer size. IOCP async receive buffer size per socket. Larger values reduce small-packet merges but waste memory with many connections. Default 8k.": "Ukuran buffer. Ukuran buffer penerimaan asinkron IOCP per soket. Nilai yang lebih besar mengurangi penggabungan paket kecil tetapi memakan memori dengan banyak koneksi. Default: 8k."
"Kernel receive buffer (SO_RCVBUF). 0 means do not modify; use the system default.": "Buffer penerimaan kernel (SO_RCVBUF). 0 berarti tidak mengubah; gunakan default sistem."
"Send/receive log body length. HEX length of data logged by LogSend/LogReceive. Default 64 bytes.": "Panjang badan log kirim/terima. Panjang HEX data yang dicatat oleh LogSend/LogReceive. Default: 64 byte."
"Auto GZip request body size. Applies to requests from HttpHelper/ApiHttpClient. Default 1024; 0 disables compression.": "Ukuran badan permintaan untuk mengaktifkan GZip otomatis. Berlaku untuk permintaan dari HttpHelper/ApiHttpClient. Default: 1024; 0 menonaktifkan kompresi."
"UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture.": "UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture."
