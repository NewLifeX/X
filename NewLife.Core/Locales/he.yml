"Network debugging.": "ניפוי באגים ברשת."
"Session timeout. A TCP/UDP session is taken offline after being inactive for this period. Default 20*60 seconds.": "פסק זמן של הפעלה. הפעלת TCP/UDP מועברת למצב לא מקוון לאחר תקופת חוסר פעילות זו. ברירת מחדל: 20*60 שניות."
"Buffer size. IOCP async receive buffer size per socket. Larger values reduce small-packet merges but waste memory with many connections. Default 8k.": "גודל מאגר. גודל מאגר הקבלה האסינכרוני של IOCP לכל socket. ערכים גדולים יותר מפחיתים איחוד חבילות קטנות אך צורכים זיכרון עם חיבורים רבים. ברירת מחדל: 8k."
"Kernel receive buffer (SO_RCVBUF). 0 means do not modify; use the system default.": "מאגר קבלת Kernel (SO_RCVBUF). 0 פירושו לא לשנות; השתמש בברירת המחדל של המערכת."
"Send/receive log body length. HEX length of data logged by LogSend/LogReceive. Default 64 bytes.": "אורך גוף יומן שליחה/קבלה. אורך HEX של נתונים שנרשמים על ידי LogSend/LogReceive. ברירת מחדל: 64 בתים."
"Auto GZip request body size. Applies to requests from HttpHelper/ApiHttpClient. Default 1024; 0 disables compression.": "גודל גוף הבקשה להפעלת GZip אוטומטית. חל על בקשות מ-HttpHelper/ApiHttpClient. ברירת מחדל: 1024; 0 משבית דחיסה."
