"System settings": "Sistem ayarları"
"System name": "Sistem adı"
"English name used to identify the system; must not contain spaces.": "Sistemi tanımlayan İngilizce ad; boşluk içeremez."
"System version": "Sistem sürümü"
"Assembly version number, used for UI display.": "UI görüntülemesi için kullanılan derleme sürüm numarası."
"System display name": "Görünen ad"
"User-visible name.": "Kullanıcı tarafından görülen ad."
"Company": "Şirket"
"Company name, from assembly information.": "Derleme bilgilerinden şirket adı."
"Application instance": "Uygulama örneği"
"Uniquely identifies the instance node when a single application is deployed with multiple instances.": "Tek bir uygulama birden çok örnekle dağıtıldığında örnek düğümünü benzersiz şekilde tanımlar."
"Developer mode": "Geliştirici modu"
"Enables development and debugging features (SQL collection, backup, development operations).": "Geliştirme ve hata ayıklama özelliklerini (SQL toplama, yedekleme, geliştirme işlemleri) etkinleştirir."
"Enabled": "Etkin"
"Whether the system is enabled.": "Sistemin etkin olup olmadığı."
"Install time": "Yükleme zamanı"
"First installation time of the system, used as the Cookie encryption key.": "Sistemin ilk yükleme zamanı, Cookie şifreleme anahtarı olarak kullanılır."
"Core settings": "Çekirdek ayarlar"
"Global debugging. Enables XTrace.Debug.": "Genel hata ayıklama. XTrace.Debug'ı etkinleştirir."
"Log level. Only logs at or above this level are output: All/Debug/Info/Warn/Error/Fatal. Default Info.": "Günlük düzeyi. Yalnızca bu düzey ve üzerindeki günlükler çıkarılır: All/Debug/Info/Warn/Error/Fatal. Varsayılan: Info."
"File log directory. Defaults to the Log subdirectory.": "Dosya günlüğü dizini. Varsayılan: Log alt dizini."
"Log file size limit (MB). Splits a new log file when exceeded. Default 10 MB; 0 means unlimited.": "Günlük dosyası boyut sınırı (MB). Aşıldığında yeni bir günlük dosyası oluşturulur. Varsayılan: 10 MB; 0 sınırsız demektir."
"Log file backups. The oldest files are deleted when the count is exceeded. Cybersecurity law requires at least 6 months of logs. Default 200; 0 means unlimited.": "Günlük dosyası yedekleri. Sayı aşıldığında en eski dosyalar silinir. Siber güvenlik yasası en az 6 aylık günlük saklamayı gerektirir. Varsayılan: 200; 0 sınırsız demektir."
"Log file format. Default {0:yyyy_MM_dd}.log; supports level placeholders such as {1}_{0:yyyy_MM_dd}.log.": "Günlük dosyası biçimi. Varsayılan: {0:yyyy_MM_dd}.log; {1}_{0:yyyy_MM_dd}.log gibi düzey yer tutucularını destekler."
"Log line format. Default Time|ThreadId|Kind|Name|Message; Level is also supported.": "Günlük satırı biçimi. Varsayılan: Time|ThreadId|Kind|Name|Message; Level da desteklenir."
"Network log. Broadcasts local subnet logs to udp://255.255.255.255:514, or http://xxx:80/log.": "Ağ günlüğü. Yerel alt ağ günlüklerini udp://255.255.255.255:514 veya http://xxx:80/log adresine yayınlar."
"Data directory. Local database directory; defaults to the Data subdirectory.": "Veri dizini. Yerel veritabanı dizini; varsayılan: Data alt dizini."
"Backup directory. Directory for database backups; defaults to the Backup subdirectory.": "Yedekleme dizini. Veritabanı yedekleri için dizin; varsayılan: Backup alt dizini."
"Plugin directory. Local plugin directory; defaults to the Plugins subdirectory.": "Eklenti dizini. Yerel eklenti dizini; varsayılan: Plugins alt dizini."
"Plugin server. Analyzes links by keyword and downloads plugins from this page. Some embedded devices do not support HTTPS.": "Eklenti sunucusu. Bağlantıları anahtar kelimeye göre analiz eder ve bu sayfadan eklenti indirir. Bazı gömülü cihazlar HTTPS'yi desteklemez."
"Assembly resolve assistance. Whether to help resolve missing dependency assemblies during assembly loading. Default false.": "Derleme çözümleme yardımı. Yükleme sırasında eksik bağımlı derlemelerin çözülmesine yardımcı olunup olunmayacağını belirler. Varsayılan: false."
"Service address. Public address visited by users, outside the reverse proxy, used to construct other URLs (such as SSO) or register with the registry. Separate multiple addresses with commas.": "Hizmet adresi. Kullanıcıların ziyaret ettiği genel adres, ters proxy dışında, diğer URL'leri (SSO gibi) oluşturmak veya kayıt defterine kaydolmak için kullanılır. Birden çok adresi virgülle ayırın."
"Network settings": "Ağ ayarları"
"Network debugging.": "Ağ hata ayıklama."
"Session timeout. A TCP/UDP session is taken offline after being inactive for this period. Default 20*60 seconds.": "Oturum zaman aşımı. Bir TCP/UDP oturumu bu hareketsizlik süresinden sonra çevrimdışı yapılır. Varsayılan: 20*60 saniye."
"Buffer size. IOCP async receive buffer size per socket. Larger values reduce small-packet merges but waste memory with many connections. Default 8k.": "Tampon boyutu. Soket başına IOCP zaman uyumsuz alma tamponu boyutu. Daha büyük değerler küçük paket birleştirmeyi azaltır ancak çok sayıda bağlantıda bellek tüketir. Varsayılan: 8k."
"Kernel receive buffer (SO_RCVBUF). 0 means do not modify; use the system default.": "Çekirdek alma tamponu (SO_RCVBUF). 0 değiştirilmemesi anlamına gelir; sistem varsayılanını kullanın."
"Send/receive log body length. HEX length of data logged by LogSend/LogReceive. Default 64 bytes.": "Gönderme/alma günlüğü gövde uzunluğu. LogSend/LogReceive tarafından günlüğe kaydedilen verilerin HEX uzunluğu. Varsayılan: 64 bayt."
"Auto GZip request body size. Applies to requests from HttpHelper/ApiHttpClient. Default 1024; 0 disables compression.": "Otomatik GZip isteği gövde boyutu. HttpHelper/ApiHttpClient isteklerine uygulanır. Varsayılan: 1024; 0 sıkıştırmayı devre dışı bırakır."
