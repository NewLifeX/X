"Install time": "Время установки"
"First installation time of the system, used as the Cookie encryption key.": "Время первой установки системы, используется как ключ шифрования Cookie."
"Core settings": "Основные параметры"
"Global debugging. Enables XTrace.Debug.": "Глобальная отладка. Включает XTrace.Debug."
"Log level. Only logs at or above this level are output: All/Debug/Info/Warn/Error/Fatal. Default Info.": "Уровень журнала. Выводятся только журналы этого уровня и выше: All/Debug/Info/Warn/Error/Fatal. По умолчанию: Info."
"File log directory. Defaults to the Log subdirectory.": "Каталог файловых журналов. По умолчанию: подкаталог Log."
"Log file size limit (MB). Splits a new log file when exceeded. Default 10 MB; 0 means unlimited.": "Ограничение размера файла журнала (МБ). При превышении создается новый файл. По умолчанию: 10 МБ; 0 означает без ограничений."
"Log file backups. The oldest files are deleted when the count is exceeded. Cybersecurity law requires at least 6 months of logs. Default 200; 0 means unlimited.": "Количество резервных копий файлов журнала. При превышении самые старые файлы удаляются. Закон о кибербезопасности требует хранить журналы не менее 6 месяцев. По умолчанию: 200; 0 означает без ограничений."
"Log file format. Default {0:yyyy_MM_dd}.log; supports level placeholders such as {1}_{0:yyyy_MM_dd}.log.": "Формат файла журнала. По умолчанию: {0:yyyy_MM_dd}.log; поддерживаются заполнители уровня, например {1}_{0:yyyy_MM_dd}.log."
"Log line format. Default Time|ThreadId|Kind|Name|Message; Level is also supported.": "Формат строки журнала. По умолчанию: Time|ThreadId|Kind|Name|Message; также поддерживается Level."
"Network log. Broadcasts local subnet logs to udp://255.255.255.255:514, or http://xxx:80/log.": "Сетевой журнал. Передает журналы локальной подсети на udp://255.255.255.255:514 или http://xxx:80/log."
"Data directory. Local database directory; defaults to the Data subdirectory.": "Каталог данных. Каталог локальной базы данных; по умолчанию: подкаталог Data."
"Backup directory. Directory for database backups; defaults to the Backup subdirectory.": "Каталог резервных копий. Каталог для резервных копий базы данных; по умолчанию: подкаталог Backup."
"Plugin directory. Local plugin directory; defaults to the Plugins subdirectory.": "Каталог плагинов. Локальный каталог плагинов; по умолчанию: подкаталог Plugins."
"Plugin server. Analyzes links by keyword and downloads plugins from this page. Some embedded devices do not support HTTPS.": "Сервер плагинов. Анализирует ссылки по ключевым словам и загружает плагины с этой страницы. Некоторые встраиваемые устройства не поддерживают HTTPS."
"Assembly resolve assistance. Whether to help resolve missing dependency assemblies during assembly loading. Default false.": "Помощь в разрешении сборок. Указывает, помогать ли в разрешении отсутствующих зависимых сборок при загрузке. По умолчанию: false."
"Service address. Public address visited by users, outside the reverse proxy, used to construct other URLs (such as SSO) or register with the registry. Separate multiple addresses with commas.": "Адрес службы. Публичный адрес, посещаемый пользователями, вне обратного прокси, используется для построения других URL (например, SSO) или регистрации в реестре. Несколько адресов разделяйте запятыми."
"Network settings": "Параметры сети"
"Network debugging.": "Сетевая отладка."
"Session timeout. A TCP/UDP session is taken offline after being inactive for this period. Default 20*60 seconds.": "Тайм-аут сеанса. Сеанс TCP/UDP отключается после этого периода неактивности. По умолчанию: 20*60 секунд."
"Buffer size. IOCP async receive buffer size per socket. Larger values reduce small-packet merges but waste memory with many connections. Default 8k.": "Размер буфера. Размер буфера асинхронного приема IOCP на сокет. Большие значения уменьшают объединение мелких пакетов, но расходуют память при большом числе подключений. По умолчанию: 8k."
"Kernel receive buffer (SO_RCVBUF). 0 means do not modify; use the system default.": "Буфер приема ядра (SO_RCVBUF). 0 означает не изменять; используйте системное значение по умолчанию."
"Send/receive log body length. HEX length of data logged by LogSend/LogReceive. Default 64 bytes.": "Длина тела данных журнала отправки/приема. Длина HEX данных, записываемых LogSend/LogReceive. По умолчанию: 64 байта."
"Auto GZip request body size. Applies to requests from HttpHelper/ApiHttpClient. Default 1024; 0 disables compression.": "Размер тела запроса для автоматического включения GZip. Применяется к запросам HttpHelper/ApiHttpClient. По умолчанию: 1024; 0 отключает сжатие."
"UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture.": "UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture."
