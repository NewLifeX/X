"System settings": "Configurações do sistema"
"System name": "Nome do sistema"
"English name used to identify the system; must not contain spaces.": "Nome em inglês que identifica o sistema; não pode conter espaços."
"System version": "Versão do sistema"
"Assembly version number, used for UI display.": "Número da versão do assembly, usado para exibição na interface."
"System display name": "Nome de exibição"
"User-visible name.": "Nome visível para o usuário."
"Company": "Empresa"
"Company name, from assembly information.": "Nome da empresa, das informações do assembly."
"Application instance": "Instância do aplicativo"
"Uniquely identifies the instance node when a single application is deployed with multiple instances.": "Identifica exclusivamente o nó da instância quando um único aplicativo é implantado com várias instâncias."
"Developer mode": "Modo de desenvolvedor"
"Enables development and debugging features (SQL collection, backup, development operations).": "Ativa recursos de desenvolvimento e depuração (coleta de SQL, backup, operações de desenvolvimento)."
"Enabled": "Habilitado"
"Whether the system is enabled.": "Indica se o sistema está habilitado."
"Install time": "Hora de instalação"
"First installation time of the system, used as the Cookie encryption key.": "Hora da primeira instalação do sistema, usada como chave de criptografia de cookies."
"Core settings": "Configurações principais"
"Global debugging. Enables XTrace.Debug.": "Depuração global. Ativa XTrace.Debug."
"Log level. Only logs at or above this level are output: All/Debug/Info/Warn/Error/Fatal. Default Info.": "Nível de log. Somente logs deste nível ou superior são emitidos: All/Debug/Info/Warn/Error/Fatal. Padrão: Info."
"File log directory. Defaults to the Log subdirectory.": "Diretório de logs de arquivo. Padrão: subdiretório Log."
"Log file size limit (MB). Splits a new log file when exceeded. Default 10 MB; 0 means unlimited.": "Limite de tamanho do arquivo de log (MB). Um novo arquivo é criado ao exceder. Padrão: 10 MB; 0 significa ilimitado."
"Log file backups. The oldest files are deleted when the count is exceeded. Cybersecurity law requires at least 6 months of logs. Default 200; 0 means unlimited.": "Backups de arquivos de log. Os arquivos mais antigos são excluídos ao exceder a contagem. A lei de segurança cibernética exige pelo menos 6 meses de logs. Padrão: 200; 0 significa ilimitado."
"Log file format. Default {0:yyyy_MM_dd}.log; supports level placeholders such as {1}_{0:yyyy_MM_dd}.log.": "Formato do arquivo de log. Padrão: {0:yyyy_MM_dd}.log; suporta marcadores de nível como {1}_{0:yyyy_MM_dd}.log."
"Log line format. Default Time|ThreadId|Kind|Name|Message; Level is also supported.": "Formato da linha de log. Padrão: Time|ThreadId|Kind|Name|Message; Level também é suportado."
"Network log. Broadcasts local subnet logs to udp://255.255.255.255:514, or http://xxx:80/log.": "Log de rede. Transmite logs da sub-rede local para udp://255.255.255.255:514 ou http://xxx:80/log."
"Data directory. Local database directory; defaults to the Data subdirectory.": "Diretório de dados. Diretório do banco de dados local; padrão: subdiretório Data."
"Backup directory. Directory for database backups; defaults to the Backup subdirectory.": "Diretório de backup. Diretório para backups do banco de dados; padrão: subdiretório Backup."
"Plugin directory. Local plugin directory; defaults to the Plugins subdirectory.": "Diretório de plugins. Diretório local de plugins; padrão: subdiretório Plugins."
"Plugin server. Analyzes links by keyword and downloads plugins from this page. Some embedded devices do not support HTTPS.": "Servidor de plugins. Analisa links por palavra-chave e baixa plugins desta página. Alguns dispositivos embarcados não suportam HTTPS."
"Assembly resolve assistance. Whether to help resolve missing dependency assemblies during assembly loading. Default false.": "Assistência de resolução de assemblies. Indica se deve ajudar a resolver assemblies dependentes ausentes durante o carregamento. Padrão: false."
"Service address. Public address visited by users, outside the reverse proxy, used to construct other URLs (such as SSO) or register with the registry. Separate multiple addresses with commas.": "Endereço de serviço. Endereço público visitado pelos usuários, fora do proxy reverso, usado para construir outras URLs (como SSO) ou registrar no registro. Separe vários endereços por vírgulas."
"Network settings": "Configurações de rede"
"Network debugging.": "Depuração de rede."
"Session timeout. A TCP/UDP session is taken offline after being inactive for this period. Default 20*60 seconds.": "Tempo limite de sessão. Uma sessão TCP/UDP é colocada offline após este período de inatividade. Padrão: 20*60 segundos."
"Buffer size. IOCP async receive buffer size per socket. Larger values reduce small-packet merges but waste memory with many connections. Default 8k.": "Tamanho do buffer. Tamanho do buffer de recepção assíncrona IOCP por soquete. Valores maiores reduzem a fusão de pacotes pequenos, mas consomem memória com muitas conexões. Padrão: 8k."
"Kernel receive buffer (SO_RCVBUF). 0 means do not modify; use the system default.": "Buffer de recepção do kernel (SO_RCVBUF). 0 significa não modificar; use o padrão do sistema."
"Send/receive log body length. HEX length of data logged by LogSend/LogReceive. Default 64 bytes.": "Comprimento do corpo dos logs de envio/recepção. Comprimento HEX dos dados registrados por LogSend/LogReceive. Padrão: 64 bytes."
"Auto GZip request body size. Applies to requests from HttpHelper/ApiHttpClient. Default 1024; 0 disables compression.": "Tamanho do corpo da solicitação para ativar GZip automaticamente. Aplica-se a solicitações de HttpHelper/ApiHttpClient. Padrão: 1024; 0 desativa a compactação."
"UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture.": "Idioma da interface. Valores: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Vazio segue o sistema; um idioma compatível fixa o idioma da interface e do log, independentemente da cultura da solicitação."
