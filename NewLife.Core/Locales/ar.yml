"Data directory. Local database directory; defaults to the Data subdirectory.": "دليل البيانات. دليل قاعدة البيانات المحلية؛ الافتراضي: الدليل الفرعي Data."
"Backup directory. Directory for database backups; defaults to the Backup subdirectory.": "دليل النسخ الاحتياطي. دليل نسخ قاعدة البيانات الاحتياطية؛ الافتراضي: الدليل الفرعي Backup."
"Plugin directory. Local plugin directory; defaults to the Plugins subdirectory.": "دليل الإضافات. دليل الإضافات المحلي؛ الافتراضي: الدليل الفرعي Plugins."
"Plugin server. Analyzes links by keyword and downloads plugins from this page. Some embedded devices do not support HTTPS.": "خادم الإضافات. يحلل الروابط حسب الكلمات المفتاحية وينزّل الإضافات من هذه الصفحة. بعض الأجهزة المدمجة لا تدعم HTTPS."
"Assembly resolve assistance. Whether to help resolve missing dependency assemblies during assembly loading. Default false.": "مساعدة حل التجميعات. يحدد ما إذا كان يساعد في حل التجميعات التابعة المفقودة أثناء التحميل. الافتراضي: false."
"Service address. Public address visited by users, outside the reverse proxy, used to construct other URLs (such as SSO) or register with the registry. Separate multiple addresses with commas.": "عنوان الخدمة. العنوان العام الذي يزوره المستخدمون، خارج الوكيل العكسي، يُستخدم لإنشاء عناوين URL أخرى (مثل SSO) أو التسجيل في السجل. افصل بين العناوين المتعددة بفواصل."
"Network settings": "إعدادات الشبكة"
"Network debugging.": "تصحيح الشبكة."
