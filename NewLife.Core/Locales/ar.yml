"Buffer size. IOCP async receive buffer size per socket. Larger values reduce small-packet merges but waste memory with many connections. Default 8k.": "حجم المخزن المؤقت. حجم مخزن الاستقبال غير المتزامن IOCP لكل مقبس. القيم الأكبر تقلل دمج الحزم الصغيرة لكنها تستهلك الذاكرة مع العديد من الاتصالات. الافتراضي: 8k."
"Kernel receive buffer (SO_RCVBUF). 0 means do not modify; use the system default.": "مخزن استقبال النواة (SO_RCVBUF). 0 يعني عدم التعديل؛ استخدم الافتراضي للنظام."
"Send/receive log body length. HEX length of data logged by LogSend/LogReceive. Default 64 bytes.": "طول جسم سجل الإرسال/الاستقبال. طول HEX للبيانات المسجلة بواسطة LogSend/LogReceive. الافتراضي: 64 بايت."
"Auto GZip request body size. Applies to requests from HttpHelper/ApiHttpClient. Default 1024; 0 disables compression.": "حجم جسم الطلب لتمكين GZip تلقائيًا. ينطبق على الطلبات من HttpHelper/ApiHttpClient. الافتراضي: 1024؛ 0 يعطل الضغط."
"UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture.": "UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture."
