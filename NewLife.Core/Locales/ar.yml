"Core settings": "الإعدادات الأساسية"
"Global debugging. Enables XTrace.Debug.": "التصحيح العام. يمكّن XTrace.Debug."
"Log level. Only logs at or above this level are output: All/Debug/Info/Warn/Error/Fatal. Default Info.": "مستوى السجل. يتم إخراج السجلات عند هذا المستوى أو أعلى فقط: All/Debug/Info/Warn/Error/Fatal. الافتراضي: Info."
"File log directory. Defaults to the Log subdirectory.": "دليل سجلات الملفات. الافتراضي: الدليل الفرعي Log."
"Log file size limit (MB). Splits a new log file when exceeded. Default 10 MB; 0 means unlimited.": "حد حجم ملف السجل (ميغابايت). يتم إنشاء ملف سجل جديد عند تجاوزه. الافتراضي: 10 ميغابايت؛ 0 يعني بلا حد."
"Log file backups. The oldest files are deleted when the count is exceeded. Cybersecurity law requires at least 6 months of logs. Default 200; 0 means unlimited.": "نسخ احتياطي لملفات السجل. يتم حذف أقدم الملفات عند تجاوز العدد. يتطلب قانون الأمن السيبراني الاحتفاظ بالسجلات لمدة 6 أشهر على الأقل. الافتراضي: 200؛ 0 يعني بلا حد."
"Log file format. Default {0:yyyy_MM_dd}.log; supports level placeholders such as {1}_{0:yyyy_MM_dd}.log.": "تنسيق ملف السجل. الافتراضي: {0:yyyy_MM_dd}.log؛ يدعم عناصر المستوى مثل {1}_{0:yyyy_MM_dd}.log."
"Log line format. Default Time|ThreadId|Kind|Name|Message; Level is also supported.": "تنسيق سطر السجل. الافتراضي: Time|ThreadId|Kind|Name|Message؛ يتم دعم Level أيضًا."
