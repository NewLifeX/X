"Log line format. Default Time|ThreadId|Kind|Name|Message; Level is also supported.": "日誌行格式。預設Time|ThreadId|Kind|Name|Message，還支援Level"
"Network log. Broadcasts local subnet logs to udp://255.255.255.255:514, or http://xxx:80/log.": "網路日誌。本地子網日誌廣播udp://255.255.255.255:514，或者http://xxx:80/log"
