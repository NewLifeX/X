"Whether the system is enabled.": "Чи ввімкнено систему."
"Install time": "Час встановлення"
"First installation time of the system, used as the Cookie encryption key.": "Час першого встановлення системи, використовується як ключ шифрування Cookie."
"Core settings": "Основні параметри"
"Global debugging. Enables XTrace.Debug.": "Глобальне налагодження. Вмикає XTrace.Debug."
"Log level. Only logs at or above this level are output: All/Debug/Info/Warn/Error/Fatal. Default Info.": "Рівень журналу. Виводяться лише журнали цього рівня або вищі: All/Debug/Info/Warn/Error/Fatal. За замовчуванням: Info."
"File log directory. Defaults to the Log subdirectory.": "Каталог файлових журналів. За замовчуванням: підкаталог Log."
"Log file size limit (MB). Splits a new log file when exceeded. Default 10 MB; 0 means unlimited.": "Обмеження розміру файлу журналу (МБ). Після перевищення створюється новий файл. За замовчуванням: 10 МБ; 0 означає без обмежень."
"Log file backups. The oldest files are deleted when the count is exceeded. Cybersecurity law requires at least 6 months of logs. Default 200; 0 means unlimited.": "Резервні копії файлів журналів. Найстаріші файли видаляються після перевищення кількості. Закон про кібербезпеку вимагає зберігати журнали щонайменше 6 місяців. За замовчуванням: 200; 0 означає без обмежень."
"Log file format. Default {0:yyyy_MM_dd}.log; supports level placeholders such as {1}_{0:yyyy_MM_dd}.log.": "Формат файлу журналу. За замовчуванням: {0:yyyy_MM_dd}.log; підтримуються заповнювачі рівня, наприклад {1}_{0:yyyy_MM_dd}.log."
"Log line format. Default Time|ThreadId|Kind|Name|Message; Level is also supported.": "Формат рядка журналу. За замовчуванням: Time|ThreadId|Kind|Name|Message; також підтримується Level."
"Network log. Broadcasts local subnet logs to udp://255.255.255.255:514, or http://xxx:80/log.": "Мережевий журнал. Передає журнали локальної підмережі на udp://255.255.255.255:514 або http://xxx:80/log."
"Data directory. Local database directory; defaults to the Data subdirectory.": "Каталог даних. Каталог локальної бази даних; за замовчуванням: підкаталог Data."
"Backup directory. Directory for database backups; defaults to the Backup subdirectory.": "Каталог резервних копій. Каталог для резервних копій бази даних; за замовчуванням: підкаталог Backup."
"Plugin directory. Local plugin directory; defaults to the Plugins subdirectory.": "Каталог плагінів. Локальний каталог плагінів; за замовчуванням: підкаталог Plugins."
"Plugin server. Analyzes links by keyword and downloads plugins from this page. Some embedded devices do not support HTTPS.": "Сервер плагінів. Аналізує посилання за ключовими словами та завантажує плагіни з цієї сторінки. Деякі вбудовані пристрої не підтримують HTTPS."
"Assembly resolve assistance. Whether to help resolve missing dependency assemblies during assembly loading. Default false.": "Допомога з розв'язанням збірок. Визначає, чи допомагати розв'язувати відсутні залежні збірки під час завантаження. За замовчуванням: false."
"Service address. Public address visited by users, outside the reverse proxy, used to construct other URLs (such as SSO) or register with the registry. Separate multiple addresses with commas.": "Адреса служби. Публічна адреса, яку відвідують користувачі, поза зворотним проксі, використовується для побудови інших URL (наприклад, SSO) або реєстрації в реєстрі. Кілька адрес розділяйте комами."
"Network settings": "Параметри мережі"
"Network debugging.": "Мережеве налагодження."
"Session timeout. A TCP/UDP session is taken offline after being inactive for this period. Default 20*60 seconds.": "Тайм-аут сеансу. Сеанс TCP/UDP переводиться в офлайн після цього періоду неактивності. За замовчуванням: 20*60 секунд."
"Buffer size. IOCP async receive buffer size per socket. Larger values reduce small-packet merges but waste memory with many connections. Default 8k.": "Розмір буфера. Розмір буфера асинхронного приймання IOCP на сокет. Більші значення зменшують об'єднання дрібних пакетів, але споживають пам'ять за великої кількості з'єднань. За замовчуванням: 8k."
"Kernel receive buffer (SO_RCVBUF). 0 means do not modify; use the system default.": "Буфер приймання ядра (SO_RCVBUF). 0 означає не змінювати; використовуйте системне значення за замовчуванням."
"Send/receive log body length. HEX length of data logged by LogSend/LogReceive. Default 64 bytes.": "Довжина тіла журналу надсилання/приймання. Довжина HEX даних, які записуються LogSend/LogReceive. За замовчуванням: 64 байти."
"Auto GZip request body size. Applies to requests from HttpHelper/ApiHttpClient. Default 1024; 0 disables compression.": "Розмір тіла запиту для автоматичного ввімкнення GZip. Застосовується до запитів від HttpHelper/ApiHttpClient. За замовчуванням: 1024; 0 вимикає стиснення."
"UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture.": "UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture."
