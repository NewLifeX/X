"System settings": "Paramètres système"
"System name": "Nom du système"
"English name used to identify the system; must not contain spaces.": "Nom anglais identifiant le système ; ne doit pas contenir d'espaces."
"System version": "Version du système"
"Assembly version number, used for UI display.": "Numéro de version de l'assembly, utilisé pour l'affichage dans l'interface."
"System display name": "Nom d'affichage"
"User-visible name.": "Nom visible par l'utilisateur."
"Company": "Société"
"Company name, from assembly information.": "Nom de la société, issu des informations de l'assembly."
"Application instance": "Instance d'application"
"Uniquely identifies the instance node when a single application is deployed with multiple instances.": "Identifie de manière unique le nœud d'instance lorsque plusieurs instances d'une même application sont déployées."
"Developer mode": "Mode développeur"
"Enables development and debugging features (SQL collection, backup, development operations).": "Active les fonctionnalités de développement et de débogage (collecte SQL, sauvegarde, opérations de développement)."
"Enabled": "Activé"
"Whether the system is enabled.": "Indique si le système est activé."
"Install time": "Date d'installation"
"First installation time of the system, used as the Cookie encryption key.": "Date de première installation du système, utilisée comme clé de chiffrement des cookies."
"Core settings": "Paramètres principaux"
"Global debugging. Enables XTrace.Debug.": "Débogage global. Active XTrace.Debug."
"Log level. Only logs at or above this level are output: All/Debug/Info/Warn/Error/Fatal. Default Info.": "Niveau de journalisation. Seuls les journaux de ce niveau ou supérieur sont générés : All/Debug/Info/Warn/Error/Fatal. Par défaut : Info."
"File log directory. Defaults to the Log subdirectory.": "Répertoire des journaux de fichiers. Par défaut : sous-répertoire Log."
"Log file size limit (MB). Splits a new log file when exceeded. Default 10 MB; 0 means unlimited.": "Limite de taille du fichier journal (Mo). Un nouveau fichier journal est créé au-delà. Par défaut : 10 Mo ; 0 signifie illimité."
"Log file backups. The oldest files are deleted when the count is exceeded. Cybersecurity law requires at least 6 months of logs. Default 200; 0 means unlimited.": "Nombre de sauvegardes de fichiers journaux. Les fichiers les plus anciens sont supprimés au-delà. La loi sur la cybersécurité exige au moins 6 mois de journaux. Par défaut : 200 ; 0 signifie illimité."
"Log file format. Default {0:yyyy_MM_dd}.log; supports level placeholders such as {1}_{0:yyyy_MM_dd}.log.": "Format du fichier journal. Par défaut : {0:yyyy_MM_dd}.log ; prend en charge les espaces réservés de niveau tels que {1}_{0:yyyy_MM_dd}.log."
"Log line format. Default Time|ThreadId|Kind|Name|Message; Level is also supported.": "Format des lignes de journal. Par défaut : Time|ThreadId|Kind|Name|Message ; Level est également pris en charge."
"Network log. Broadcasts local subnet logs to udp://255.255.255.255:514, or http://xxx:80/log.": "Journal réseau. Diffuse les journaux du sous-réseau local vers udp://255.255.255.255:514 ou http://xxx:80/log."
"Data directory. Local database directory; defaults to the Data subdirectory.": "Répertoire des données. Répertoire de la base de données locale ; par défaut : sous-répertoire Data."
"Backup directory. Directory for database backups; defaults to the Backup subdirectory.": "Répertoire de sauvegarde. Répertoire de stockage des sauvegardes de base de données ; par défaut : sous-répertoire Backup."
"Plugin directory. Local plugin directory; defaults to the Plugins subdirectory.": "Répertoire des plugins. Répertoire local des plugins ; par défaut : sous-répertoire Plugins."
"Plugin server. Analyzes links by keyword and downloads plugins from this page. Some embedded devices do not support HTTPS.": "Serveur de plugins. Analyse les liens par mot-clé et télécharge les plugins depuis cette page. Certains appareils embarqués ne prennent pas en charge HTTPS."
"Assembly resolve assistance. Whether to help resolve missing dependency assemblies during assembly loading. Default false.": "Assistance à la résolution des assemblies. Indique s'il faut aider à résoudre les assemblies dépendantes manquantes lors du chargement. Par défaut : false."
"Service address. Public address visited by users, outside the reverse proxy, used to construct other URLs (such as SSO) or register with the registry. Separate multiple addresses with commas.": "Adresse de service. Adresse publique visitée par les utilisateurs, en dehors du proxy inverse, utilisée pour construire d'autres URL (comme SSO) ou s'enregistrer auprès du registre. Séparez plusieurs adresses par des virgules."
"Network settings": "Paramètres réseau"
"Network debugging.": "Débogage réseau."
"Session timeout. A TCP/UDP session is taken offline after being inactive for this period. Default 20*60 seconds.": "Délai d'expiration de session. Une session TCP/UDP est mise hors ligne après cette période d'inactivité. Par défaut : 20*60 secondes."
"Buffer size. IOCP async receive buffer size per socket. Larger values reduce small-packet merges but waste memory with many connections. Default 8k.": "Taille du tampon. Taille du tampon de réception asynchrone IOCP par socket. Des valeurs plus grandes réduisent la fusion des petits paquets mais consomment de la mémoire avec de nombreuses connexions. Par défaut : 8k."
"Kernel receive buffer (SO_RCVBUF). 0 means do not modify; use the system default.": "Tampon de réception du noyau (SO_RCVBUF). 0 signifie ne pas modifier ; utilisez la valeur par défaut du système."
"Send/receive log body length. HEX length of data logged by LogSend/LogReceive. Default 64 bytes.": "Longueur du corps des journaux d'envoi/réception. Longueur HEX des données journalisées par LogSend/LogReceive. Par défaut : 64 octets."
"Auto GZip request body size. Applies to requests from HttpHelper/ApiHttpClient. Default 1024; 0 disables compression.": "Taille du corps de requête pour l'activation automatique de GZip. S'applique aux requêtes de HttpHelper/ApiHttpClient. Par défaut : 1024 ; 0 désactive la compression."
"UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture.": "UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture."
