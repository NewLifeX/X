"System settings": "Ustawienia systemu"
"System name": "Nazwa systemu"
"English name used to identify the system; must not contain spaces.": "Angielska nazwa identyfikująca system; nie może zawierać spacji."
"System version": "Wersja systemu"
"Assembly version number, used for UI display.": "Numer wersji zestawu, używany do wyświetlania w interfejsie."
"System display name": "Nazwa wyświetlana"
"User-visible name.": "Nazwa widoczna dla użytkownika."
"Company": "Firma"
"Company name, from assembly information.": "Nazwa firmy z informacji o zestawie."
"Application instance": "Wystąpienie aplikacji"
"Uniquely identifies the instance node when a single application is deployed with multiple instances.": "Jednoznacznie identyfikuje węzeł wystąpienia, gdy jedna aplikacja jest wdrażana w wielu wystąpieniach."
"Developer mode": "Tryb dewelopera"
"Enables development and debugging features (SQL collection, backup, development operations).": "Włącza funkcje programistyczne i debugowania (zbieranie SQL, kopie zapasowe, operacje programistyczne)."
"Enabled": "Włączone"
"Whether the system is enabled.": "Czy system jest włączony."
"Install time": "Czas instalacji"
"First installation time of the system, used as the Cookie encryption key.": "Czas pierwszej instalacji systemu, używany jako klucz szyfrowania plików cookie."
"Core settings": "Ustawienia podstawowe"
"Global debugging. Enables XTrace.Debug.": "Globalne debugowanie. Włącza XTrace.Debug."
"Log level. Only logs at or above this level are output: All/Debug/Info/Warn/Error/Fatal. Default Info.": "Poziom dziennika. Wyprowadzane są tylko dzienniki tego poziomu i wyższe: All/Debug/Info/Warn/Error/Fatal. Domyślnie: Info."
"File log directory. Defaults to the Log subdirectory.": "Katalog dzienników plików. Domyślnie: podkatalog Log."
"Log file size limit (MB). Splits a new log file when exceeded. Default 10 MB; 0 means unlimited.": "Limit rozmiaru pliku dziennika (MB). Po przekroczeniu tworzony jest nowy plik. Domyślnie: 10 MB; 0 oznacza brak limitu."
"Log file backups. The oldest files are deleted when the count is exceeded. Cybersecurity law requires at least 6 months of logs. Default 200; 0 means unlimited.": "Kopie zapasowe plików dziennika. Najstarsze pliki są usuwane po przekroczeniu liczby. Prawo o cyberbezpieczeństwie wymaga przechowywania dzienników przez co najmniej 6 miesięcy. Domyślnie: 200; 0 oznacza brak limitu."
"Log file format. Default {0:yyyy_MM_dd}.log; supports level placeholders such as {1}_{0:yyyy_MM_dd}.log.": "Format pliku dziennika. Domyślnie: {0:yyyy_MM_dd}.log; obsługuje symbole zastępcze poziomu, takie jak {1}_{0:yyyy_MM_dd}.log."
"Log line format. Default Time|ThreadId|Kind|Name|Message; Level is also supported.": "Format wiersza dziennika. Domyślnie: Time|ThreadId|Kind|Name|Message; Level jest również obsługiwany."
"Network log. Broadcasts local subnet logs to udp://255.255.255.255:514, or http://xxx:80/log.": "Dziennik sieciowy. Rozgłasza dzienniki podsieci lokalnej do udp://255.255.255.255:514 lub http://xxx:80/log."
"Data directory. Local database directory; defaults to the Data subdirectory.": "Katalog danych. Katalog lokalnej bazy danych; domyślnie: podkatalog Data."
"Backup directory. Directory for database backups; defaults to the Backup subdirectory.": "Katalog kopii zapasowych. Katalog kopii zapasowych bazy danych; domyślnie: podkatalog Backup."
"Plugin directory. Local plugin directory; defaults to the Plugins subdirectory.": "Katalog wtyczek. Lokalny katalog wtyczek; domyślnie: podkatalog Plugins."
"Plugin server. Analyzes links by keyword and downloads plugins from this page. Some embedded devices do not support HTTPS.": "Serwer wtyczek. Analizuje linki według słów kluczowych i pobiera wtyczki z tej strony. Niektóre urządzenia wbudowane nie obsługują HTTPS."
"Assembly resolve assistance. Whether to help resolve missing dependency assemblies during assembly loading. Default false.": "Pomoc w rozwiązywaniu zestawów. Określa, czy pomagać w rozwiązywaniu brakujących zestawów zależnych podczas ładowania. Domyślnie: false."
"Service address. Public address visited by users, outside the reverse proxy, used to construct other URLs (such as SSO) or register with the registry. Separate multiple addresses with commas.": "Adres usługi. Publiczny adres odwiedzany przez użytkowników, poza odwrotnym proxy, używany do konstruowania innych adresów URL (np. SSO) lub rejestracji w rejestrze. Wiele adresów oddzielaj przecinkami."
"Network settings": "Ustawienia sieci"
"Network debugging.": "Debugowanie sieci."
"Session timeout. A TCP/UDP session is taken offline after being inactive for this period. Default 20*60 seconds.": "Limit czasu sesji. Sesja TCP/UDP jest przełączana w tryb offline po tym okresie braku aktywności. Domyślnie: 20*60 sekund."
"Buffer size. IOCP async receive buffer size per socket. Larger values reduce small-packet merges but waste memory with many connections. Default 8k.": "Rozmiar bufora. Rozmiar bufora asynchronicznego odbioru IOCP na gniazdo. Większe wartości zmniejszają scalanie małych pakietów, ale zużywają pamięć przy wielu połączeniach. Domyślnie: 8k."
"Kernel receive buffer (SO_RCVBUF). 0 means do not modify; use the system default.": "Bufor odbioru jądra (SO_RCVBUF). 0 oznacza brak modyfikacji; użyj wartości domyślnej systemu."
"Send/receive log body length. HEX length of data logged by LogSend/LogReceive. Default 64 bytes.": "Długość treści dziennika wysyłania/odbierania. Długość HEX danych rejestrowanych przez LogSend/LogReceive. Domyślnie: 64 bajty."
"Auto GZip request body size. Applies to requests from HttpHelper/ApiHttpClient. Default 1024; 0 disables compression.": "Rozmiar treści żądania automatycznego włączania GZip. Dotyczy żądań z HttpHelper/ApiHttpClient. Domyślnie: 1024; 0 wyłącza kompresję."
"UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture.": "UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture."
