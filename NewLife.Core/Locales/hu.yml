"Developer mode": "Fejlesztői mód"
"Enables development and debugging features (SQL collection, backup, development operations).": "Engedélyezi a fejlesztési és hibakeresési funkciókat (SQL-gyűjtés, biztonsági mentés, fejlesztési műveletek)."
"Enabled": "Engedélyezve"
"Whether the system is enabled.": "A rendszer engedélyezve van-e."
"Install time": "Telepítési idő"
"First installation time of the system, used as the Cookie encryption key.": "A rendszer első telepítésének ideje, Cookie-titkosítási kulcsként használják."
"Core settings": "Alapbeállítások"
"Global debugging. Enables XTrace.Debug.": "Globális hibakeresés. Engedélyezi az XTrace.Debugot."
"Log level. Only logs at or above this level are output: All/Debug/Info/Warn/Error/Fatal. Default Info.": "Naplózási szint. Csak ezen a szinten vagy magasabban lévő naplók kerülnek kiírásra: All/Debug/Info/Warn/Error/Fatal. Alapértelmezett: Info."
"File log directory. Defaults to the Log subdirectory.": "Fájlnapló könyvtára. Alapértelmezett: Log alkönyvtár."
"Log file size limit (MB). Splits a new log file when exceeded. Default 10 MB; 0 means unlimited.": "Naplófájl méretkorlátja (MB). Túllépéskor új naplófájl jön létre. Alapértelmezett: 10 MB; 0 = korlátlan."
"Log file backups. The oldest files are deleted when the count is exceeded. Cybersecurity law requires at least 6 months of logs. Default 200; 0 means unlimited.": "Naplófájlok biztonsági mentései. A legrégebbi fájlok törlődnek a szám túllépésekor. A kiberbiztonsági törvény legalább 6 hónapos naplózást ír elő. Alapértelmezett: 200; 0 = korlátlan."
"Log file format. Default {0:yyyy_MM_dd}.log; supports level placeholders such as {1}_{0:yyyy_MM_dd}.log.": "Naplófájl formátuma. Alapértelmezett: {0:yyyy_MM_dd}.log; támogatja a szint helyőrzőket, például {1}_{0:yyyy_MM_dd}.log."
"Log line format. Default Time|ThreadId|Kind|Name|Message; Level is also supported.": "Naplósor formátuma. Alapértelmezett: Time|ThreadId|Kind|Name|Message; a Level is támogatott."
"Network log. Broadcasts local subnet logs to udp://255.255.255.255:514, or http://xxx:80/log.": "Hálózati napló. A helyi alhálózat naplóit továbbítja a udp://255.255.255.255:514 vagy http://xxx:80/log címre."
"Data directory. Local database directory; defaults to the Data subdirectory.": "Adatkönyvtár. Helyi adatbázis könyvtára; alapértelmezett: Data alkönyvtár."
"Backup directory. Directory for database backups; defaults to the Backup subdirectory.": "Biztonsági mentés könyvtára. Az adatbázis biztonsági mentéseinek könyvtára; alapértelmezett: Backup alkönyvtár."
"Plugin directory. Local plugin directory; defaults to the Plugins subdirectory.": "Beépülőmodul-könyvtár. Helyi beépülőmodul-könyvtár; alapértelmezett: Plugins alkönyvtár."
"Plugin server. Analyzes links by keyword and downloads plugins from this page. Some embedded devices do not support HTTPS.": "Beépülőmodul-kiszolgáló. Kulcsszavak alapján elemzi a hivatkozásokat, és beépülő modulokat tölt le erről az oldalról. Egyes beágyazott eszközök nem támogatják a HTTPS-t."
"Assembly resolve assistance. Whether to help resolve missing dependency assemblies during assembly loading. Default false.": "Assembly-feloldási segítség. Meghatározza, hogy a betöltés során segítsen-e a hiányzó függő assembly-k feloldásában. Alapértelmezett: false."
"Service address. Public address visited by users, outside the reverse proxy, used to construct other URLs (such as SSO) or register with the registry. Separate multiple addresses with commas.": "Szolgáltatáscím. A felhasználók által látogatott nyilvános cím, a fordított proxy mögött, amelyet más URL-ek (például SSO) építéséhez vagy a nyilvántartásban való regisztrációhoz használnak. Több címet vesszővel válasszon el."
"Network settings": "Hálózati beállítások"
"Network debugging.": "Hálózati hibakeresés."
"Session timeout. A TCP/UDP session is taken offline after being inactive for this period. Default 20*60 seconds.": "Munkamenet időtúllépése. A TCP/UDP munkamenet offline állapotba kerül ezen inaktivitási időszak után. Alapértelmezett: 20*60 másodperc."
"Buffer size. IOCP async receive buffer size per socket. Larger values reduce small-packet merges but waste memory with many connections. Default 8k.": "Pufferméret. IOCP aszinkron fogadási pufferméret socketenként. A nagyobb értékek csökkentik a kis csomagok egyesítését, de sok kapcsolat esetén memóriát fogyasztanak. Alapértelmezett: 8k."
"Kernel receive buffer (SO_RCVBUF). 0 means do not modify; use the system default.": "Kernel fogadási puffer (SO_RCVBUF). 0 = ne módosítsa; használja a rendszer alapértelmezett értékét."
"Send/receive log body length. HEX length of data logged by LogSend/LogReceive. Default 64 bytes.": "Küldési/fogadási napló törzsének hossza. A LogSend/LogReceive által naplózott adatok HEX hossza. Alapértelmezett: 64 bájt."
"Auto GZip request body size. Applies to requests from HttpHelper/ApiHttpClient. Default 1024; 0 disables compression.": "Automatikus GZip-kérés törzsmérete. A HttpHelper/ApiHttpClient kéréseire vonatkozik. Alapértelmezett: 1024; 0 letiltja a tömörítést."
"UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture.": "Felhasználói felület nyelve. Értékek: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Üres esetén a rendszert követi; a támogatott nyelv a kérés kultúrájától függetlenül rögzíti a felület és a napló nyelvét."
