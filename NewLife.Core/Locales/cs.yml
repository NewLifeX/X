"System settings": "Nastavení systému"
"System name": "Název systému"
"English name used to identify the system; must not contain spaces.": "Anglický název identifikující systém; nesmí obsahovat mezery."
"System version": "Verze systému"
"Assembly version number, used for UI display.": "Číslo verze sestavení, používá se pro zobrazení v uživatelském rozhraní."
"System display name": "Zobrazovaný název"
"User-visible name.": "Název viditelný pro uživatele."
"Company": "Společnost"
"Company name, from assembly information.": "Název společnosti z informací o sestavení."
"Application instance": "Instance aplikace"
"Uniquely identifies the instance node when a single application is deployed with multiple instances.": "Jednoznačně identifikuje uzel instance, když je jedna aplikace nasazena s více instancemi."
"Developer mode": "Režim pro vývojáře"
"Enables development and debugging features (SQL collection, backup, development operations).": "Povoluje vývojové a ladicí funkce (sběr SQL, zálohování, vývojové operace)."
"Enabled": "Povoleno"
"Whether the system is enabled.": "Zda je systém povolen."
"Install time": "Čas instalace"
"First installation time of the system, used as the Cookie encryption key.": "Čas první instalace systému, používá se jako šifrovací klíč souborů cookie."
"Core settings": "Základní nastavení"
"Global debugging. Enables XTrace.Debug.": "Globální ladění. Povoluje XTrace.Debug."
"Log level. Only logs at or above this level are output: All/Debug/Info/Warn/Error/Fatal. Default Info.": "Úroveň protokolu. Vypisují se pouze protokoly této úrovně a vyšší: All/Debug/Info/Warn/Error/Fatal. Výchozí: Info."
"File log directory. Defaults to the Log subdirectory.": "Adresář souborových protokolů. Výchozí: podadresář Log."
"Log file size limit (MB). Splits a new log file when exceeded. Default 10 MB; 0 means unlimited.": "Limit velikosti souboru protokolu (MB). Po překročení se vytvoří nový soubor. Výchozí: 10 MB; 0 znamená bez omezení."
"Log file backups. The oldest files are deleted when the count is exceeded. Cybersecurity law requires at least 6 months of logs. Default 200; 0 means unlimited.": "Zálohy souborů protokolů. Nejstarší soubory se po překročení počtu odstraní. Zákon o kybernetické bezpečnosti vyžaduje uchovávání protokolů alespoň 6 měsíců. Výchozí: 200; 0 znamená bez omezení."
"Log file format. Default {0:yyyy_MM_dd}.log; supports level placeholders such as {1}_{0:yyyy_MM_dd}.log.": "Formát souboru protokolu. Výchozí: {0:yyyy_MM_dd}.log; podporuje zástupné symboly úrovně, například {1}_{0:yyyy_MM_dd}.log."
"Log line format. Default Time|ThreadId|Kind|Name|Message; Level is also supported.": "Formát řádku protokolu. Výchozí: Time|ThreadId|Kind|Name|Message; Level je také podporován."
"Network log. Broadcasts local subnet logs to udp://255.255.255.255:514, or http://xxx:80/log.": "Síťový protokol. Vysílá protokoly místní podsítě na udp://255.255.255.255:514 nebo http://xxx:80/log."
"Data directory. Local database directory; defaults to the Data subdirectory.": "Adresář dat. Adresář místní databáze; výchozí: podadresář Data."
"Backup directory. Directory for database backups; defaults to the Backup subdirectory.": "Adresář záloh. Adresář pro zálohy databáze; výchozí: podadresář Backup."
"Plugin directory. Local plugin directory; defaults to the Plugins subdirectory.": "Adresář pluginů. Místní adresář pluginů; výchozí: podadresář Plugins."
"Plugin server. Analyzes links by keyword and downloads plugins from this page. Some embedded devices do not support HTTPS.": "Server pluginů. Analyzuje odkazy podle klíčových slov a stahuje pluginy z této stránky. Některá vestavěná zařízení nepodporují HTTPS."
"Assembly resolve assistance. Whether to help resolve missing dependency assemblies during assembly loading. Default false.": "Pomoc s řešením sestavení. Určuje, zda pomáhat s řešením chybějících závislých sestavení při načítání. Výchozí: false."
"Service address. Public address visited by users, outside the reverse proxy, used to construct other URLs (such as SSO) or register with the registry. Separate multiple addresses with commas.": "Adresa služby. Veřejná adresa navštěvovaná uživateli, mimo reverzní proxy, používaná k sestavení dalších URL (například SSO) nebo registraci v registru. Více adres oddělte čárkami."
"Network settings": "Nastavení sítě"
"Network debugging.": "Ladění sítě."
"Session timeout. A TCP/UDP session is taken offline after being inactive for this period. Default 20*60 seconds.": "Časový limit relace. Relace TCP/UDP je po této době nečinnosti převedena offline. Výchozí: 20*60 sekund."
"Buffer size. IOCP async receive buffer size per socket. Larger values reduce small-packet merges but waste memory with many connections. Default 8k.": "Velikost vyrovnávací paměti. Velikost asynchronní přijímací vyrovnávací paměti IOCP pro soket. Větší hodnoty snižují slučování malých paketů, ale spotřebovávají paměť při mnoha připojeních. Výchozí: 8k."
"Kernel receive buffer (SO_RCVBUF). 0 means do not modify; use the system default.": "Vyrovnávací paměť příjmu jádra (SO_RCVBUF). 0 znamená neměnit; použijte výchozí hodnotu systému."
"Send/receive log body length. HEX length of data logged by LogSend/LogReceive. Default 64 bytes.": "Délka těla protokolu odesílání/příjmu. Délka HEX dat protokolovaných LogSend/LogReceive. Výchozí: 64 bajtů."
"Auto GZip request body size. Applies to requests from HttpHelper/ApiHttpClient. Default 1024; 0 disables compression.": "Velikost těla požadavku pro automatické povolení GZip. Platí pro požadavky z HttpHelper/ApiHttpClient. Výchozí: 1024; 0 zakáže kompresi."
"UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture.": "UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture."
