"System name": "시스템 이름"
"English name used to identify the system; must not contain spaces.": "시스템을 식별하는 영문 이름입니다. 공백을 포함할 수 없습니다."
"System version": "시스템 버전"
"Assembly version number, used for UI display.": "어셈블리 버전 번호입니다. UI 표시에 사용됩니다."
"System display name": "표시 이름"
"User-visible name.": "사용자에게 표시되는 이름입니다."
"Company": "회사"
"Company name, from assembly information.": "회사 이름입니다. 어셈블리 정보에서 가져옵니다."
"Application instance": "애플리케이션 인스턴스"
"Uniquely identifies the instance node when a single application is deployed with multiple instances.": "단일 애플리케이션을 여러 인스턴스로 배포할 때 인스턴스 노드를 고유하게 식별합니다."
"Developer mode": "개발자 모드"
"Enables development and debugging features (SQL collection, backup, development operations).": "개발 및 디버깅 기능(SQL 수집, 백업, 개발 작업)을 활성화합니다."
"Enabled": "사용"
"Whether the system is enabled.": "시스템 사용 여부입니다."
"Install time": "설치 시간"
"First installation time of the system, used as the Cookie encryption key.": "시스템 최초 설치 시간입니다. Cookie 암호화 키로 사용됩니다."
"Core settings": "핵심 설정"
"Global debugging. Enables XTrace.Debug.": "전역 디버깅을 활성화합니다. XTrace.Debug."
"Log level. Only logs at or above this level are output: All/Debug/Info/Warn/Error/Fatal. Default Info.": "로그 수준입니다. 이 수준 이상의 로그만 출력합니다: All/Debug/Info/Warn/Error/Fatal. 기본값은 Info입니다."
"File log directory. Defaults to the Log subdirectory.": "파일 로그 디렉터리입니다. 기본값은 Log 하위 디렉터리입니다."
"Log file size limit (MB). Splits a new log file when exceeded. Default 10 MB; 0 means unlimited.": "로그 파일 크기 제한(MB)입니다. 초과하면 새 로그 파일로 분할합니다. 기본값은 10MB이며 0은 무제한입니다."
"Log file backups. The oldest files are deleted when the count is exceeded. Cybersecurity law requires at least 6 months of logs. Default 200; 0 means unlimited.": "로그 파일 백업 수입니다. 개수를 초과하면 가장 오래된 파일을 삭제합니다. 사이버보안법은 최소 6개월의 로그 보관을 요구합니다. 기본값은 200이며 0은 무제한입니다."
"Log file format. Default {0:yyyy_MM_dd}.log; supports level placeholders such as {1}_{0:yyyy_MM_dd}.log.": "로그 파일 형식입니다. 기본값은 {0:yyyy_MM_dd}.log이며 {1}_{0:yyyy_MM_dd}.log와 같은 수준 자리표시자를 지원합니다."
"Log line format. Default Time|ThreadId|Kind|Name|Message; Level is also supported.": "로그 줄 형식입니다. 기본값은 Time|ThreadId|Kind|Name|Message이며 Level도 지원합니다."
"Network log. Broadcasts local subnet logs to udp://255.255.255.255:514, or http://xxx:80/log.": "네트워크 로그입니다. 로컬 서브넷 로그를 udp://255.255.255.255:514 또는 http://xxx:80/log로 브로드캐스트합니다."
"Data directory. Local database directory; defaults to the Data subdirectory.": "데이터 디렉터리입니다. 로컬 데이터베이스 디렉터리이며 기본값은 Data 하위 디렉터리입니다."
"Backup directory. Directory for database backups; defaults to the Backup subdirectory.": "백업 디렉터리입니다. 데이터베이스 백업을 저장하는 디렉터리이며 기본값은 Backup 하위 디렉터리입니다."
"Plugin directory. Local plugin directory; defaults to the Plugins subdirectory.": "플러그인 디렉터리입니다. 로컬 플러그인 디렉터리이며 기본값은 Plugins 하위 디렉터리입니다."
"Plugin server. Analyzes links by keyword and downloads plugins from this page. Some embedded devices do not support HTTPS.": "플러그인 서버입니다. 이 페이지에서 키워드로 링크를 분석하고 플러그인을 다운로드합니다. 일부 임베디드 장치는 HTTPS를 지원하지 않습니다."
"Assembly resolve assistance. Whether to help resolve missing dependency assemblies during assembly loading. Default false.": "어셈블리 확인 지원입니다. 어셈블리 로드 중 누락된 종속 어셈블리 확인을 지원할지 여부입니다. 기본값은 false입니다."
"Service address. Public address visited by users, outside the reverse proxy, used to construct other URLs (such as SSO) or register with the registry. Separate multiple addresses with commas.": "서비스 주소입니다. 사용자가 방문하는 외부 주소(역방향 프록시 외부)로, 다른 URL(예: SSO) 구성이나 레지스트리 등록에 사용됩니다. 여러 주소는 쉼표로 구분합니다."
"Network settings": "네트워크 설정"
"Network debugging.": "네트워크 디버깅."
"Session timeout. A TCP/UDP session is taken offline after being inactive for this period. Default 20*60 seconds.": "세션 시간 제한입니다. TCP/UDP 세션이 이 시간 동안 비활성 상태이면 오프라인 처리합니다. 기본값은 20*60초입니다."
"Buffer size. IOCP async receive buffer size per socket. Larger values reduce small-packet merges but waste memory with many connections. Default 8k.": "버퍼 크기입니다. 소켓당 IOCP 비동기 수신 버퍼 크기입니다. 값을 크게 하면 작은 패킷 병합을 줄일 수 있지만 연결이 많으면 메모리를 많이 사용합니다. 기본값은 8k입니다."
"Kernel receive buffer (SO_RCVBUF). 0 means do not modify; use the system default.": "커널 수신 버퍼(SO_RCVBUF)입니다. 0은 수정하지 않고 시스템 기본값을 사용합니다."
"Send/receive log body length. HEX length of data logged by LogSend/LogReceive. Default 64 bytes.": "송수신 로그 데이터 본문 길이입니다. LogSend/LogReceive에서 기록하는 데이터의 HEX 길이입니다. 기본값은 64바이트입니다."
"Auto GZip request body size. Applies to requests from HttpHelper/ApiHttpClient. Default 1024; 0 disables compression.": "GZip 자동 사용 요청 본문 크기입니다. HttpHelper/ApiHttpClient 요청에 적용됩니다. 기본값은 1024이며 0은 압축하지 않습니다."
"UI language. Values: zh-CN, zh-TW, en-US, es-ES, de-DE, ja-JP, fr-FR, pt-BR, ru-RU, ko-KR, ar-SA, bn-BD, cs-CZ, da-DK, el-GR, fa-IR, fi-FI, he-IL, hi-IN, hu-HU, id-ID, it-IT, ms-MY, nb-NO, nl-NL, pl-PL, ro-RO, sv-SE, th-TH, tr-TR, uk-UA, vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture.": "UI language. Values: zh-CN, zh-TW, en-US, es-ES, de-DE, ja-JP, fr-FR, pt-BR, ru-RU, ko-KR, ar-SA, bn-BD, cs-CZ, da-DK, el-GR, fa-IR, fi-FI, he-IL, hi-IN, hu-HU, id-ID, it-IT, ms-MY, nb-NO, nl-NL, pl-PL, ro-RO, sv-SE, th-TH, tr-TR, uk-UA, vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture."
