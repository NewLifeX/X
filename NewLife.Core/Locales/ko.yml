"NativeAOT/trimmed environments do not support plugin dynamic loading. Use static registration or an alternative implementation.": "NativeAOT/트리밍 환경에서는 플러그인 동적 로드를 지원하지 않습니다. 정적 등록 또는 대체 구현을 사용하세요."
