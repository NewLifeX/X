"Network settings": "تنظیمات شبکه"
"Network debugging.": "اشکال‌زدایی شبکه."
"Session timeout. A TCP/UDP session is taken offline after being inactive for this period. Default 20*60 seconds.": "مهلت جلسه. جلسه TCP/UDP پس از این دوره عدم فعالیت آفلاین می‌شود. پیش‌فرض: 20*60 ثانیه."
"Buffer size. IOCP async receive buffer size per socket. Larger values reduce small-packet merges but waste memory with many connections. Default 8k.": "اندازه بافر. اندازه بافر دریافت ناهمگام IOCP برای هر سوکت. مقادیر بزرگ‌تر ادغام بسته‌های کوچک را کاهش می‌دهد اما با اتصالات زیاد حافظه مصرف می‌کند. پیش‌فرض: 8k."
"Kernel receive buffer (SO_RCVBUF). 0 means do not modify; use the system default.": "بافر دریافت هسته (SO_RCVBUF). 0 یعنی تغییر ندهید؛ از پیش‌فرض سیستم استفاده کنید."
"Send/receive log body length. HEX length of data logged by LogSend/LogReceive. Default 64 bytes.": "طول بدنه گزارش ارسال/دریافت. طول HEX داده‌های ثبت‌شده توسط LogSend/LogReceive. پیش‌فرض: 64 بایت."
"Auto GZip request body size. Applies to requests from HttpHelper/ApiHttpClient. Default 1024; 0 disables compression.": "اندازه بدنه درخواست برای فعال‌سازی خودکار GZip. برای درخواست‌های HttpHelper/ApiHttpClient اعمال می‌شود. پیش‌فرض: 1024؛ 0 فشرده‌سازی را غیرفعال می‌کند."
"UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture.": "UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture."
