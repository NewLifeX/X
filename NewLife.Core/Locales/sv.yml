"System settings": "Systeminställningar"
"System name": "Systemnamn"
"English name used to identify the system; must not contain spaces.": "Engelskt namn som identifierar systemet; får inte innehålla mellanslag."
"System version": "Systemversion"
"Assembly version number, used for UI display.": "Sammansättningens versionsnummer, används för visning i användargränssnittet."
"System display name": "Visningsnamn"
"User-visible name.": "Namn som är synligt för användaren."
"Company": "Företag"
"Company name, from assembly information.": "Företagsnamn, från sammansättningsinformation."
"Application instance": "Programinstans"
"Uniquely identifies the instance node when a single application is deployed with multiple instances.": "Identifierar instansnoden unikt när ett enda program distribueras med flera instanser."
"Developer mode": "Utvecklarläge"
"Enables development and debugging features (SQL collection, backup, development operations).": "Aktiverar utvecklings- och felsökningsfunktioner (SQL-insamling, säkerhetskopiering, utvecklingsåtgärder)."
"Enabled": "Aktiverad"
"Whether the system is enabled.": "Anger om systemet är aktiverat."
"Install time": "Installationstid"
"First installation time of the system, used as the Cookie encryption key.": "Systemets första installationstid, används som Cookie-krypteringsnyckel."
"Core settings": "Kärninställningar"
"Global debugging. Enables XTrace.Debug.": "Global felsökning. Aktiverar XTrace.Debug."
"Log level. Only logs at or above this level are output: All/Debug/Info/Warn/Error/Fatal. Default Info.": "Loggnivå. Endast loggar på denna nivå eller högre skrivs ut: All/Debug/Info/Warn/Error/Fatal. Standard: Info."
"File log directory. Defaults to the Log subdirectory.": "Katalog för filloggar. Standard: underkatalogen Log."
"Log file size limit (MB). Splits a new log file when exceeded. Default 10 MB; 0 means unlimited.": "Storleksgräns för loggfil (MB). En ny loggfil skapas när gränsen överskrids. Standard: 10 MB; 0 innebär obegränsat."
"Log file backups. The oldest files are deleted when the count is exceeded. Cybersecurity law requires at least 6 months of logs. Default 200; 0 means unlimited.": "Säkerhetskopior av loggfiler. De äldsta filerna tas bort när antalet överskrids. Cybersäkerhetslagen kräver minst 6 månaders loggar. Standard: 200; 0 innebär obegränsat."
"Log file format. Default {0:yyyy_MM_dd}.log; supports level placeholders such as {1}_{0:yyyy_MM_dd}.log.": "Loggfilformat. Standard: {0:yyyy_MM_dd}.log; stöder nivåplatshållare som {1}_{0:yyyy_MM_dd}.log."
"Log line format. Default Time|ThreadId|Kind|Name|Message; Level is also supported.": "Format för loggrader. Standard: Time|ThreadId|Kind|Name|Message; Level stöds också."
"Network log. Broadcasts local subnet logs to udp://255.255.255.255:514, or http://xxx:80/log.": "Nätverkslogg. Sänder loggar från det lokala undernätet till udp://255.255.255.255:514 eller http://xxx:80/log."
"Data directory. Local database directory; defaults to the Data subdirectory.": "Datakatalog. Katalog för lokal databas; standard: underkatalogen Data."
"Backup directory. Directory for database backups; defaults to the Backup subdirectory.": "Säkerhetskopieringskatalog. Katalog för databassäkerhetskopior; standard: underkatalogen Backup."
"Plugin directory. Local plugin directory; defaults to the Plugins subdirectory.": "Plugin-katalog. Lokal plugin-katalog; standard: underkatalogen Plugins."
"Plugin server. Analyzes links by keyword and downloads plugins from this page. Some embedded devices do not support HTTPS.": "Plugin-server. Analyserar länkar efter nyckelord och laddar ner plugins från denna sida. Vissa inbäddade enheter stöder inte HTTPS."
"Assembly resolve assistance. Whether to help resolve missing dependency assemblies during assembly loading. Default false.": "Hjälp med sammansättningsupplösning. Anger om saknade beroende sammansättningar ska lösas under inläsning. Standard: false."
"Service address. Public address visited by users, outside the reverse proxy, used to construct other URLs (such as SSO) or register with the registry. Separate multiple addresses with commas.": "Tjänstadress. Offentlig adress som användare besöker, utanför omvänd proxy, används för att konstruera andra URL:er (som SSO) eller registrera i registret. Separera flera adresser med kommatecken."
"Network settings": "Nätverksinställningar"
"Network debugging.": "Nätverksfelsökning."
"Session timeout. A TCP/UDP session is taken offline after being inactive for this period. Default 20*60 seconds.": "Sessions-timeout. En TCP/UDP-session tas offline efter denna inaktivitetsperiod. Standard: 20*60 sekunder."
"Buffer size. IOCP async receive buffer size per socket. Larger values reduce small-packet merges but waste memory with many connections. Default 8k.": "Buffertstorlek. IOCP asynkron mottagningsbuffertstorlek per socket. Större värden minskar sammanslagning av små paket men förbrukar minne vid många anslutningar. Standard: 8k."
"Kernel receive buffer (SO_RCVBUF). 0 means do not modify; use the system default.": "Kärnans mottagningsbuffert (SO_RCVBUF). 0 innebär att inte ändra; använd systemets standard."
"Send/receive log body length. HEX length of data logged by LogSend/LogReceive. Default 64 bytes.": "Längd på loggdatans body för sändning/mottagning. HEX-längd på data som loggas av LogSend/LogReceive. Standard: 64 byte."
"Auto GZip request body size. Applies to requests from HttpHelper/ApiHttpClient. Default 1024; 0 disables compression.": "Storlek på begärandebody för automatiskt GZip. Gäller begäranden från HttpHelper/ApiHttpClient. Standard: 1024; 0 inaktiverar komprimering."
"UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture.": "Gränssnittsspråk. Värden: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Tom följer systemet; ett språk som stöds låser gränssnitts- och loggspråket oavsett begärans kultur."
