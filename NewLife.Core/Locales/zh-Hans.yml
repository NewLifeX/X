"Stop {0} {1}": "停止 {0} {1}"
"Timer.Add {0}": "添加定时器 {0}"
"Timer.Remove {0} reason:{1}": "移除定时器 {0}，原因：{1}"
"Tracer[{0}] Total={1:n0} Errors={2:n0} Speed={3:n2}tps Cost={4:n0}ms MaxCost={5:n0}ms MinCost={6:n0}ms": "[{0}] Tracer: 总计={1:n0}, 错误数={2:n0}, 速度={3:n2} tps, 耗时={4:n0} ms, 最大耗时={5:n0} ms, 最小耗时={6:n0} ms"
"{0} v{1} Build {2:yyyy-MM-dd HH:mm:ss} {3}": "{0} 版本 v{1}, 构建时间 {2:yyyy-MM-dd HH:mm:ss}, {3}"
"System settings": "系统设置"
"System name": "系统名称"
"English name used to identify the system; must not contain spaces.": "用于标识系统的英文名，不能有空格"
"System version": "系统版本"
"Assembly version number, used for UI display.": "程序集版本号，用于界面展示"
"System display name": "显示名称"
"User-visible name.": "用户可见的名称"
"Company": "公司"
"Company name, from assembly information.": "公司名称，来自程序集信息"
"Application instance": "应用实例"
"Uniquely identifies the instance node when a single application is deployed with multiple instances.": "单应用多实例部署时用于唯一标识实例节点"
"Developer mode": "开发者模式"
"Enables development and debugging features (SQL collection, backup, development operations).": "启用后开放开发调试功能（SQL收集、备份、开发操作）"
"Enabled": "启用"
"Whether the system is enabled.": "是否启用该系统"
"Install time": "安装时间"
"First installation time of the system, used as the Cookie encryption key.": "系统首次安装时间，用作Cookie加密密钥"
"Core settings": "核心设置"
"Global debugging. Enables XTrace.Debug.": "启用全局调试。XTrace.Debug"
"Log level. Only logs at or above this level are output: All/Debug/Info/Warn/Error/Fatal. Default Info.": "日志等级。只输出大于等于该级别的日志，All/Debug/Info/Warn/Error/Fatal，默认Info"
"File log directory. Defaults to the Log subdirectory.": "文件日志目录。默认Log子目录"
"Log file size limit (MB). Splits a new log file when exceeded. Default 10 MB; 0 means unlimited.": "日志文件上限（MB）。超过上限后拆分新日志文件，默认10MB，0表示不限制大小"
"Log file backups. The oldest files are deleted when the count is exceeded. Cybersecurity law requires at least 6 months of logs. Default 200; 0 means unlimited.": "日志文件备份。超过备份数后，最旧的文件将被删除，网络安全法要求至少保存6个月日志，默认200，0表示不限制个数"
"Log file format. Default {0:yyyy_MM_dd}.log; supports level placeholders such as {1}_{0:yyyy_MM_dd}.log.": "日志文件格式。默认{0:yyyy_MM_dd}.log，支持日志等级如 {1}_{0:yyyy_MM_dd}.log"
"Log line format. Default Time|ThreadId|Kind|Name|Message; Level is also supported.": "日志行格式。默认Time|ThreadId|Kind|Name|Message，还支持Level"
"Network log. Broadcasts local subnet logs to udp://255.255.255.255:514, or http://xxx:80/log.": "网络日志。本地子网日志广播udp://255.255.255.255:514，或者http://xxx:80/log"
"Data directory. Local database directory; defaults to the Data subdirectory.": "数据目录。本地数据库目录，默认Data子目录"
"Backup directory. Directory for database backups; defaults to the Backup subdirectory.": "备份目录。备份数据库时存放的目录，默认Backup子目录"
"Plugin directory. Local plugin directory; defaults to the Plugins subdirectory.": "插件目录。本地插件存放目录，默认Plugins子目录"
"Plugin server. Analyzes links by keyword and downloads plugins from this page. Some embedded devices do not support HTTPS.": "插件服务器。将从该网页上根据关键字分析链接并下载插件，部分嵌入式设备不支持https"
"Assembly resolve assistance. Whether to help resolve missing dependency assemblies during assembly loading. Default false.": "辅助解析程序集。程序集加载过程中，被依赖程序集未能解析时，是否协助解析，默认false"
"Service address. Public address visited by users, outside the reverse proxy, used to construct other URLs (such as SSO) or register with the registry. Separate multiple addresses with commas.": "服务地址。用户访问的外网地址，反向代理之外，用于内部构造其它Url（如SSO），或者向注册中心登记，多地址逗号隔开"
"Network settings": "网络设置"
"Network debugging.": "网络调试"
"Session timeout. A TCP/UDP session is taken offline after being inactive for this period. Default 20*60 seconds.": "会话超时时间。每个Tcp/Udp连接会话，超过一定时间不活跃时做超时下线处理，默认20*60秒"
"Buffer size. IOCP async receive buffer size per socket. Larger values reduce small-packet merges but waste memory with many connections. Default 8k.": "缓冲区大小。每个IOCP异步接收缓冲区的大小，较大的值能减少小包合并，但是当连接数很多时会浪费大量内存，默认8k"
"Kernel receive buffer (SO_RCVBUF). 0 means do not modify; use the system default.": "内核接收缓冲（SO_RCVBUF）。0 表示不修改，使用系统默认"
"Send/receive log body length. HEX length of data logged by LogSend/LogReceive. Default 64 bytes.": "收发日志数据体长度。应用于LogSend/LogReceive时的数据HEX长度，默认64字节"
"Auto GZip request body size. Applies to requests from HttpHelper/ApiHttpClient. Default 1024; 0 disables compression.": "自动启用GZip压缩的请求体大小。应用于HttpHelper/ApiHttpClient发起的请求，默认1024，用0表示不压缩"
"UI language. Values: zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture.": "界面语言。可选值：zh-CN/zh-TW/en-US/es-ES/de-DE/ja-JP/fr-FR/pt-BR/ru-RU/ko-KR/ar-SA/bn-BD/cs-CZ/da-DK/el-GR/fa-IR/fi-FI/he-IL/hi-IN/hu-HU/id-ID/it-IT/ms-MY/nb-NO/nl-NL/pl-PL/ro-RO/sv-SE/th-TH/tr-TR/uk-UA/vi-VN。留空跟随系统；设置后固定界面与日志语言，不再跟随请求语言"
