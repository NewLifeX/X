"Uniquely identifies the instance node when a single application is deployed with multiple instances.": "Identifica de forma única el nodo de instancia cuando se implementan varias instancias de una misma aplicación."
"Developer mode": "Modo desarrollador"
"Enables development and debugging features (SQL collection, backup, development operations).": "Habilita funciones de desarrollo y depuración (recopilación de SQL, copia de seguridad, operaciones de desarrollo)."
"Enabled": "Habilitado"
"Whether the system is enabled.": "Indica si el sistema está habilitado."
"Install time": "Hora de instalación"
"First installation time of the system, used as the Cookie encryption key.": "Hora de la primera instalación del sistema, usada como clave de cifrado de cookies."
"Core settings": "Configuración principal"
"Global debugging. Enables XTrace.Debug.": "Depuración global. Habilita XTrace.Debug."
"Log level. Only logs at or above this level are output: All/Debug/Info/Warn/Error/Fatal. Default Info.": "Nivel de registro. Solo se emiten los registros de este nivel o superior: All/Debug/Info/Warn/Error/Fatal. Predeterminado: Info."
"File log directory. Defaults to the Log subdirectory.": "Directorio de registros de archivo. Predeterminado: subdirectorio Log."
"Log file size limit (MB). Splits a new log file when exceeded. Default 10 MB; 0 means unlimited.": "Límite de tamaño del archivo de registro (MB). Se divide en un nuevo archivo al superarlo. Predeterminado: 10 MB; 0 significa ilimitado."
"Log file backups. The oldest files are deleted when the count is exceeded. Cybersecurity law requires at least 6 months of logs. Default 200; 0 means unlimited.": "Copias de seguridad de archivos de registro. Los archivos más antiguos se eliminan al superar el número. La ley de ciberseguridad exige al menos 6 meses de registros. Predeterminado: 200; 0 significa ilimitado."
"Log file format. Default {0:yyyy_MM_dd}.log; supports level placeholders such as {1}_{0:yyyy_MM_dd}.log.": "Formato del archivo de registro. Predeterminado: {0:yyyy_MM_dd}.log; admite marcadores de nivel como {1}_{0:yyyy_MM_dd}.log."
"Log line format. Default Time|ThreadId|Kind|Name|Message; Level is also supported.": "Formato de línea de registro. Predeterminado: Time|ThreadId|Kind|Name|Message; también se admite Level."
"Network log. Broadcasts local subnet logs to udp://255.255.255.255:514, or http://xxx:80/log.": "Registro de red. Difunde los registros de la subred local a udp://255.255.255.255:514 o http://xxx:80/log."
"Data directory. Local database directory; defaults to the Data subdirectory.": "Directorio de datos. Directorio de la base de datos local; predeterminado: subdirectorio Data."
"Backup directory. Directory for database backups; defaults to the Backup subdirectory.": "Directorio de copias de seguridad. Directorio para copias de seguridad de la base de datos; predeterminado: subdirectorio Backup."
"Plugin directory. Local plugin directory; defaults to the Plugins subdirectory.": "Directorio de complementos. Directorio local de complementos; predeterminado: subdirectorio Plugins."
"Plugin server. Analyzes links by keyword and downloads plugins from this page. Some embedded devices do not support HTTPS.": "Servidor de complementos. Analiza enlaces por palabra clave y descarga complementos desde esta página. Algunos dispositivos integrados no admiten HTTPS."
"Assembly resolve assistance. Whether to help resolve missing dependency assemblies during assembly loading. Default false.": "Asistencia de resolución de ensamblados. Indica si se debe ayudar a resolver ensamblados dependientes faltantes durante la carga. Predeterminado: false."
"Service address. Public address visited by users, outside the reverse proxy, used to construct other URLs (such as SSO) or register with the registry. Separate multiple addresses with commas.": "Dirección de servicio. Dirección pública visitada por los usuarios, fuera del proxy inverso, usada para construir otras URL (como SSO) o registrarse en el registro. Separe varias direcciones con comas."
"Network settings": "Configuración de red"
"Network debugging.": "Depuración de red."
"Session timeout. A TCP/UDP session is taken offline after being inactive for this period. Default 20*60 seconds.": "Tiempo de espera de sesión. Una sesión TCP/UDP se desconecta tras este período de inactividad. Predeterminado: 20*60 segundos."
"Buffer size. IOCP async receive buffer size per socket. Larger values reduce small-packet merges but waste memory with many connections. Default 8k.": "Tamaño del búfer. Tamaño del búfer de recepción asíncrona IOCP por socket. Los valores grandes reducen la fusión de paquetes pequeños pero consumen memoria con muchas conexiones. Predeterminado: 8k."
"Kernel receive buffer (SO_RCVBUF). 0 means do not modify; use the system default.": "Búfer de recepción del kernel (SO_RCVBUF). 0 significa no modificar; use el valor predeterminado del sistema."
"Send/receive log body length. HEX length of data logged by LogSend/LogReceive. Default 64 bytes.": "Longitud del cuerpo de los registros de envío/recepción. Longitud HEX de los datos registrados por LogSend/LogReceive. Predeterminado: 64 bytes."
"Auto GZip request body size. Applies to requests from HttpHelper/ApiHttpClient. Default 1024; 0 disables compression.": "Tamaño del cuerpo de la solicitud para habilitar GZip automáticamente. Se aplica a las solicitudes de HttpHelper/ApiHttpClient. Predeterminado: 1024; 0 desactiva la compresión."
"UI language. Values: zh-CN, zh-TW, en-US, es-ES, de-DE, ja-JP, fr-FR, pt-BR, ru-RU, ko-KR, ar-SA, bn-BD, cs-CZ, da-DK, el-GR, fa-IR, fi-FI, he-IL, hi-IN, hu-HU, id-ID, it-IT, ms-MY, nb-NO, nl-NL, pl-PL, ro-RO, sv-SE, th-TH, tr-TR, uk-UA, vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture.": "UI language. Values: zh-CN, zh-TW, en-US, es-ES, de-DE, ja-JP, fr-FR, pt-BR, ru-RU, ko-KR, ar-SA, bn-BD, cs-CZ, da-DK, el-GR, fa-IR, fi-FI, he-IL, hi-IN, hu-HU, id-ID, it-IT, ms-MY, nb-NO, nl-NL, pl-PL, ro-RO, sv-SE, th-TH, tr-TR, uk-UA, vi-VN. Empty follows the system; a supported language fixes the UI and log language regardless of request culture."
